defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  online_learning: False
  online_actor_cpu: True
  online_actor_flush_steps: 128
  online_actor_replay_size: 250000
  online_sync_every: 180
  online_replay_sync_interval: 5
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope, wandb]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    wandb_fps: 40
    report_wandb_fps: 5
    wandb_videos: False  # send only scalars/histograms/images to wandb, no video (storage quota)
    user: ''
    wandb_project: dreamerv3
    wandb_entity: vasilache
    wandb_mode: online

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1, image: True}
    # Director paper, Sec. 3.1: "Episodes last for 2000 steps and there are
    # no intermediate rewards for activating the pads." Both our pinpad.py
    # and the released Director repo default the constructor to length=10000
    # and neither ships an env override, so every pinpad run before
    # 2026-08-26 used 5x the paper's episode. Reward is +10 per completed pad
    # sequence with the agent's position reset after, so score scales roughly
    # linearly with episode length -- a 10k-step run is not comparable to the
    # paper's Figure 5 at all.
    pinpad: {length: 2000}
    # Physical OIST smartphone robot reached over TCP; the phone connects
    # in and drives the control clock. See embodied/envs/robot.py.
    # speed_scale converts encoder speeds into reward units. The phone now
    # reports instantaneous rather than exponentially averaged speed, which is
    # ~20x larger: |v| reaches 58000 with p99 near 8300, so 1e-3 made the drift
    # penalty 0.1*|v|*scale reach 5.8 against a reward bounded at 1.0 and drove
    # observed rewards to -21. 1e-4 puts the p99 penalty at 0.083. Re-derive
    # from a fresh calibration run; this is from data taken before the IMU
    # backlog fix, so the wheel figures are sound but were logged alongside
    # 8.5s-stale tilt.
    #
    # theta_lo/theta_hi are the bumper stops relative to upright, which the
    # user set to 0 by eye. The tilt term is normalised per side so both stops
    # score 0; fall_angle 0 disables termination, since the body cannot
    # self-right and terminating would collapse the run into 1-step episodes.
    robot: {host: '0.0.0.0', port: 3000, length: 200, discrete: True, timeout: 20.0, speed_scale: 1e-4, fall_angle: 0.0, spin_penalty: 0.1, rate_penalty: 0.05, theta_zero: 0.0, theta_lo: -0.123, theta_hi: 0.173, theta_sigma: 0.05, drift_penalty: 0.1, ref_range: 0.09, ref_hold: 100, status_every: 0, recover_gain: 0.0, recover_k: 4.0, recover_tol: 0.05, recover_max: 250, recover_min: 0.6, repeat: 1, use_logdir: True}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 1000
    save_every: 900
    # Permanent analysis checkpoints on a step grid, kept forever under
    # logdir/ckpt_milestones/ (agent params only, no replay). 0 disables.
    save_every_steps: 500000
    # Stack worker 0's frames into an episode video for the logger. Pure
    # logging; scalars are unaffected.
    log_video: True
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    from_checkpoint_regex: '.*'
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    # Driver placement, not a logging switch: True steps every env in-process,
    # False gives each env its own process. Upstream defaults it False, but
    # measured on BIG/A100 (2026-08-09, 8 DMC envs at 64x64) in-process is
    # FASTER -- 40.0 vs 36.4 env fps, GPU busy 0.90 vs 0.79 -- because piping
    # every observation to a subprocess costs more than stepping these envs
    # inline. Leave True unless envs get much more expensive to step.
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    deterministic: False
    expect_devices: 0
    enable_policy: True
    precompile: True
    coordinator_address: ''
    profiler: False

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3, goal_autoencoder: 1.0, goal_duration_prior: 1.0, goal_soft_reuse: 1.0}
    # Three independent optimizers (Director-style): the world model + heads, the
    # goal autoencoder (VAE), and the actor-critic (manager + worker actors/critics).
    # All default to the same DreamerV3 settings; tune per-component lr/agc as needed.
    opt: {lr: 1e-4, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 1e-2, schedule: const, warmup: 1000, anneal: 0}
    goal_opt: {lr: 1e-4, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 1e-2, schedule: const, warmup: 1000, anneal: 0}
    ac_opt: {lr: 1e-4, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 1e-2, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    goal_enc: {layers: 3, units: 1024, act: silu, norm: rms, output: onehot, outscale: 0.1, unimix: 0.0, winit: trunc_normal_in}
    goal_dec: {layers: 3, units: 1024, act: silu, norm: rms, output: mse, outscale: 0.1, winit: trunc_normal_in}
    # --- Lipschitz-constrained SOM-VAE goal autoencoder (see hrl/goal_ae.py) ---
    # ``director`` keeps the categorical + straight-through head above. ``vq``
    # swaps in the blockwise vector quantizer; the manager's (L, C) one-hot
    # action space is unchanged either way, only the decoder's input differs.
    # Use the named blocks goal_vq / goal_som / goal_lipvq / goal_som_lipvq
    # rather than setting these by hand.
    goal_ae_impl: director      # director | vq
    goal_vq:
      dim: 8                    # embedding dim per block; L*dim is the decoder input
      som: False                # circular neighborhood loss + second reconstruction
      lip: False                # row-wise weight normalization + Lipschitz penalty
      # How reconstruction error reaches the encoder. `on` everywhere: the
      # straight-through estimator of VQ-VAE. SOM-VAE replaces it with a second
      # reconstruction from z_e, and `auto` used to follow that on the SOM arms,
      # but measured here that leaves the encoder's output variance collapsing
      # during training (z_std 0.11 vs 1.20) and the codebook with it
      # (perplexity 2.7 vs 7.9 of 8, reconstruction 375 vs 12). The SOM arms
      # keep the second reconstruction in addition. `off` with som=False
      # reproduces the LipVQ-VAE released code, which collapses outright
      # (perplexity 1.00). See test_goal_ae.py TestLearning.
      # Quoted: unquoted on/off are YAML 1.1 booleans.
      ste: 'on'                 # 'on' | 'off' | 'auto' (= not som)
      agg: sum                  # reduction of the quadratic terms over (L, dim)
      temp: 1.0                 # softmax temperature for the soft code / entropy
      stddev: 0.05              # codebook init scale (official SOM-VAE value)
      include_self: False       # official SOM-VAE also pulls the winner
      # 'ring' wraps and has no boundary; 'line' is an open path whose end
      # entries have one neighbor, masked rather than replaced by a zero
      # vector. A line spans a wider range of code distances (ideal
      # adjacent/arbitrary ratio 0.333 at C=8, against a ring's 0.533).
      topology: ring            # ring | line
      # Emit the original SOM-VAE's single commitment term alpha*||z_e - z_q||^2
      # with no stop-gradients, instead of the equal-weighted codebook+commit
      # split. Gradient-identical to the split (only the logged value differs);
      # exists so an arm can be literally the equation in the source paper.
      commit_joint: False
      # Controller on the commitment weight, targeting codebook perplexity.
      # Replaces commit_scale when on. Targets perplexity and not used_frac:
      # used_frac sits at 0.99-1.00 in every healthy run and only moves once
      # the codebook is dead, while perplexity varies smoothly over the healthy
      # range (6.3-7.6 of 8) and falls to ~1.3 on collapse. Perplexity cannot
      # reach 8 (that needs every entry used equally), so the target must sit
      # inside the reachable range.
      # DIRECTION IS UNRESOLVED -- do not use this without re-deriving it.
      # It was built assuming a higher commitment weight collapses the codebook,
      # which held on a RING (alpha=1.0 gave perplexity 1.8 at 100k) but is
      # REVERSED on a line, where alpha=1.0 gives 5.14 and alpha=0.25 gives 4.03
      # at the same step (e488 vs e486, identical but for alpha). A monotone
      # controller therefore has no single correct sign across topologies, and
      # as written it would drive the weight to its floor on a line. Left in
      # place, and off, until the fixed sweep establishes the shape of the
      # relationship.
      commit_adapt: False
      commit_adapt_target: 7.0    # of a possible 8
      commit_adapt_init: 0.25     # start at the VQ-VAE commitment weight
      commit_adapt_min: 1e-3
      commit_adapt_max: 4.0
      commit_adapt_vel: 0.02      # slow: perplexity is a noisy batch statistic
      codebook_scale: 1.0       # ||sg[z_e] - z_q||^2
      commit_scale: 1.0         # ||z_e - sg[z_q]||^2  (equal weights == the
                                # single alpha term in motivation.tex)
      som_scale: 0.9            # neighborhood term (official SOM-VAE beta)
      # L_Lipschitz weight. LipVQ-VAE's gamma=1e-6 goes with its `prod` form and
      # a single constrained layer; with the 8 layers here `prod` reaches ~6e10
      # and the penalty becomes 99.96% of the goal-AE loss. `logprod` is
      # monotone in the same quantity with a depth-independent gradient, and
      # 0.03 puts the term at roughly 10% of the reconstruction.
      lip_scale: 0.03
      lip_impl: logprod         # logprod | prod (paper / Liu et al.) | sum (motivation.tex)
      # Which networks the constraint applies to. motivation.tex says encoder AND
      # decoder; LipVQ-VAE constrains only the encoder. Default follows
      # motivation.tex: the decoder's bound is what makes a small code edit a
      # small GOAL edit, which is the property being tested.
      lip_apply: enc_dec        # enc | dec | enc_dec
      lip_out: True             # also constrain the final projection
      # One bound per output unit. NOT the paper's form: Liu et al. carry a
      # single scalar c_i per layer (their listing broadcasts `softplus_ci`
      # against the vector of row sums), and LipVQ-VAE follows them. Because
      # `bound()` reduces the per-unit bounds with `max`, the penalty's
      # gradient is a one-hot on the widest unit, so it pulls on 1 of 1024
      # bounds per layer instead of all of them. Set False for the paper form.
      lip_per_row: True
      lip_cinit: -1.0           # <0: init the bound to the layer's own row sums
      lip_clamp: True           # never scale a compliant row UP (paper + code)
      # Require norm=none so the per-layer bounds compose into a bound on the
      # whole trunk rather than on its linear layers alone.
      strict_bound: True
      # 'default' = nets.COMPUTE_DTYPE (bfloat16). 'float32' runs only the goal
      # autoencoder trunks in f32, which is what makes norm=none trainable.
      dtype: default            # default | float32
      # Give the manager policy the codebook's geometry: its per-block logits
      # become -s*||v - e_c||^2 against the (stop-gradiented) codebook instead
      # of C free logits, so a REINFORCE update favouring an entry also favours
      # its ring neighbours. Only meaningful with som=True. See
      # hrl/goal_ae.py ManagerRingHead.
      mgr_ring: False
      # Logits are -scale * (d^2 / mean d^2), so scale is dimensionless. 5 puts
      # the policy near 0.6 normalized entropy at init, just above the 0.5 that
      # mgr_actent targets, so the entropy regularizer tightens rather than
      # fights from below. 1 would be a uniform policy.
      mgr_ring_scale_init: 8.0
      # Alternative to mgr_ring, and a cleaner single-factor change: instead of
      # reparameterizing the manager's logits, spread the sampled skill event
      # over its ring neighbours before the REINFORCE log-prob, so an advantage
      # credited to one entry is also credited at this weight to the adjacent
      # ones. 0.0 reproduces the standard estimator exactly, so the arm differs
      # from goal_som_lipvq in this one number. Only meaningful with som=True.
      mgr_smooth: 0.0
    # Trunks for the vq encoder/decoder. norm is `none` so the per-layer
    # Lipschitz bounds compose into a bound on the whole trunk (a rescaling
    # norm layer is not 1-Lipschitz and breaks the composition). An earlier
    # revision used `rms` after the unnormalized trunk produced non-finite
    # values within 2-16 train steps; that turned out to be specific to V100 --
    # the same configuration runs 1500 steps clean on A100, where the
    # experiments execute, and the goal autoencoder in isolation is clean on
    # both. See hrl/lipschitz.py LipMLP and goal_vq.dtype for the f32 fallback.
    goal_vq_enc: {layers: 3, units: 1024, act: silu, norm: none, outscale: 0.1, winit: trunc_normal_in}
    goal_vq_dec: {layers: 3, units: 1024, act: silu, norm: none, outscale: 0.1, winit: trunc_normal_in}
    # Director-style factorized codes: L categoricals × C classes (L×C logits, L×C one-hot).
    # Master HRL switch. When False, the agent collapses to the v4-online flat AC:
    # single ``pol``/``val`` over WM features, no manager/goal-VAE, no skill aggregation.
    use_hrl: True
    # Manager-policy input conditioning (masked goals only; all default off, so the
    # manager input stays exactly feat2tensor(feat)). Each appends a stop-gradient'd
    # channel built from the PRE-edit running code Z so the manager can see what it is
    # editing / whether the standing goal was already reached. See agent._mgr_input.
    mgr_cond_goalcode: False   # concat flattened pre-edit running code Z (L*C dims); auto-forced True below by goal_soft_reuse_adapt regardless of this default
    # Direct (REINFORCE-free) implicit sparsity (2026-07-16, F18 follow-up #2).
    # F18 found impl_sparsity_mode catastrophic because "kept" has no
    # differentiable representation under plain (direct) sampling -- the only
    # channel was a stop-gradiented reward penalty through REINFORCE.
    # goal_delta_mode fixes this by recombining the SAMPLE itself with the
    # past; this is a cheaper alternative that leaves sampling untouched
    # (mutually exclusive with goal_delta_mode) and instead adds an ordinary
    # loss on the OVERLAP between this decision's own softmax and the previous
    # decision's: sum_c p_t[c]*p_{t-1}[c] per block, averaged over blocks --
    # bounded in [0,1] by Cauchy-Schwarz (the probability an independent draw
    # from each distribution would land on the same class). No sampling, no
    # decoder pass; backprops straight into both steps' own logits through
    # their softmax (see agent._emit_manager's goal_soft_reuse_adapt branch).
    # Implies mgr_cond_goalcode (forced on in agent.py), with that channel
    # carrying the previous decision's SOFT distribution instead of the
    # one-hot (mirrors goal_delta_mode's own input-side change; see
    # _mgr_input). Dual-ascent Lagrange multiplier (inverse=True, "push up
    # when below target", same sense as goal_reuse_adapt) holds mean overlap
    # AT goal_soft_reuse_target rather than driving it to 1 unconditionally.
    # Default masking mechanism (2026-07-22): block-overlap reuse, ratcheted to
    # target 0.5, struct+ratchet -- the e286 (hopper BIG)/e290 (cheetah BIG) recipe,
    # the best-performing cell of the F19 retest (both above their Director
    # baseline late in training; see EXPERIMENTS.md §2/§3 F19 interim update and
    # paper/main.tex §softreuse). Pairs with goal_struct_adapt/_target below.
    goal_soft_reuse_adapt: False
    goal_soft_reuse_target: 0.5
    # Open-loop anneal of the target itself (agent.Ratchet, same mechanism as
    # impl_sparsity_target_sched / goal_reuse_target_sched): ramps from
    # goal_soft_reuse_target_init toward goal_soft_reuse_target by at most
    # goal_soft_reuse_target_vel per training call. Default init == target ->
    # no-op (constant target from step 0) unless explicitly ratcheted.
    goal_soft_reuse_target_init: 0.0
    # BIG-scale calibration (0->0.5 over ~2M env-steps at MGR_FREQ=8,
    # train_ratio=64); e286/e290 exact value. Small-scale runs should override
    # to ~1.0e-6 (project convention: BIG vel * small/BIG env-steps-per-call
    # ratio), matching GOAL_SOFT_REUSE_TARGET_VEL in the sbatch templates.
    goal_soft_reuse_target_vel: 3.9e-6
    goal_soft_reuse_adapt_init: 1.0
    goal_soft_reuse_adapt_min: 1e-5
    goal_soft_reuse_adapt_max: 100.0
    goal_soft_reuse_adapt_vel: 0.1
    goal_soft_reuse_adapt_one_sided: False
    skill_shape: [8, 8]
    skill_classes: 8
    goal_autoencoder_beta: 1.0
    # Geometry preservation: extra goal-AE term making code-space cosine_max
    # distances match deter-space distances (far->far, near->near, proportional),
    # so running-goal edits move the goal predictably. 0 = off. Folds into the
    # goal_autoencoder loss (no separate scale). See pairwise_cosmax / goal/struct_*.
    goal_struct_weight: 0.0
    # Log goal/struct_corr[_hard] (Pearson r between goal-space and goal-code
    # pairwise geometry, see agent.py's struct_diag block) every train step
    # even when the struct loss itself is off (goal_struct_weight=0, no
    # adapt) -- e.g. to track this property across training for pure-
    # Director baselines. See experiments/goal_code_struct_corr/. Off by
    # default (extra O((batch_size*batch_length)^2) work per train step).
    goal_struct_diag: False
    # Structural-correlation variants (all gated; defaults reproduce the original
    # fixed-weight deter/MSE behavior exactly). target: geometry source the code is
    # matched to -- ``deter`` (default) or ``feat`` (full deter+stoch tensor, the
    # richer target the worker actually conditions on). kind: ``mse`` (squared
    # Gram-matrix match) or ``margin`` (contrastive pull-positives / push-negatives
    # hinge that separates far-apart states' codes more aggressively, margin width
    # ``goal_struct_margin``). adapt: wrap the struct term in an AutoAdapt (dual-
    # ascent Lagrangian) that tunes the weight toward a ``goal/struct_loss``
    # setpoint instead of using the fixed weight -- grows while loss > target,
    # shrinks while loss < target, by default (two-sided, like the mask-rate and
    # duration controllers). goal_struct_adapt_one_sided=True switches to a
    # ratchet that still grows on violation but never shrinks back once the
    # target is cleared -- useful if the setpoint is observed to be re-violated
    # later in training (BIG-scale struct loss drifts back up under a fixed
    # weight) and premature relaxation is a concern; off by default.
    goal_struct_target: deter   # deter | feat
    goal_struct_loss: mse       # mse | margin
    goal_struct_margin: 0.1
    # e286/e290 default recipe (see goal_soft_reuse_adapt above): struct+ratchet
    # on top of the block-overlap reuse loss, target 0.01 (not the 0.005 general
    # struct-adapt setpoint -- this specific pairing was tuned as target 0.01).
    goal_struct_adapt: False
    goal_struct_adapt_target: 0.01
    goal_struct_adapt_one_sided: False
    goal_struct_adapt_min: 1.0
    goal_struct_adapt_max: 2000.0
    goal_struct_adapt_vel: 0.1
    goal_struct_adapt_init: 200.0
    # Goal reconstruction reduction over the ``deter`` dim. ``sum`` (DreamerV3/
    # Director default) sums squared error -> magnitude scales with ``deter`` and
    # shifts the rec:kl balance across model sizes. ``mean`` averages per-dim then
    # rescales by ``goal_rec_dim_ref`` (option 2): with ref = 1024 (6m deter) the
    # 6m run is numerically unchanged while smaller sizes are mapped onto the same
    # scale, removing the dimension-count term from cross-size comparisons.
    goal_rec_loss_agg: sum
    goal_rec_dim_ref: 1024
    # If false, KL term inside ``goal_autoencoder`` is zero (rec still trained).
    goal_kl: True
    # Director ``encdec_kl`` adaptive scale: holds KL(enc||uniform) near target nats.
    goal_kl_impl: mult
    goal_kl_target: 10.0
    goal_kl_min: 1e-5
    goal_kl_max: 1.0
    goal_kl_vel: 0.1
    goal_kl_init: 1.0
    # tau_init/tau_min are only read by `output: poisson` (see the mgr_poisson
    # block), scale_init/scale_min by `gaussian` and `studentt`, and nu by
    # `studentt` alone; they are inert for the default onehot head but must
    # exist here because elements.Config.update can only overwrite keys that
    # already exist.
    manager_policy: {layers: 3, units: 1024, act: silu, norm: rms, output: onehot, outscale: 0.1, unimix: 0.0, winit: trunc_normal_in, tau_init: 1.0, tau_min: 0.02, scale_init: 2.0, scale_min: 0.3, nu: 2.5}
    manager_sample_freq: 8
    # Variable goal length (opt-in, HiPPO-style): the manager additionally emits a
    # discrete duration p in {goal_duration_min..goal_duration_max}; the emitted
    # goal is held for exactly p steps before the next manager decision (instead of
    # the fixed ``manager_sample_freq`` window). When True, manager training drops
    # the fixed-K downsampling and trains on the FULL-resolution rollout, masking
    # the REINFORCE policy loss to the per-step manager-decision (``switch``) steps;
    # the worker resets its goal-window lambda-return at the same switch boundaries.
    # False = fixed-K Director behavior (byte-for-byte unchanged). Pair with a larger
    # ``imag_length`` (e.g. 32) so several decisions fit per imagined rollout.
    variable_goal_length: False
    goal_duration_min: 1
    goal_duration_max: 16
    # HiTS-style timed subgoals (Guertler et al. 2021): append the normalized
    # countdown until the next manager decision (steps left incl. current, mapped
    # to [-1, 1] by the duration budget) to the worker policy AND value inputs.
    # Makes the worker's per-goal horizon observable — under variable_goal_length
    # the deadline is otherwise random and invisible to the worker. False = the
    # worker sees only (feat, goal), exactly as before.
    worker_timed_goals: False
    # Soft prior pulling the manager's expected goal duration toward a setpoint
    # (e.g. the fixed-K=8 regime that lifted worker reaching), independent of the
    # REINFORCE advantage. Adds ``goal_duration_reg * (E[duration] -
    # goal_duration_target)^2`` to the manager policy loss at each decision step.
    # 0 = off (advantage alone shapes the duration, as before).
    goal_duration_reg: 0.0
    goal_duration_target: 8.0
    # Mask-style Lagrangian alternative to BOTH ``goal_duration_reg`` (fixed) and
    # ``goal_duration_adapt`` (adapts a squared-error-magnitude proxy toward a
    # nonzero setpoint, so it never fully converges). This adapter regulates the
    # switch-weighted mean |E[duration] - goal_duration_target| against a small
    # tolerance (``goal_duration_lagrange_tol``): symmetric in deviation direction,
    # grows while the deviation exceeds the tolerance, self-relaxes once within it.
    # (The first version, e152-e159, regulated the RAW mean duration one-sidedly and
    # railed at max -- fixed 2026-07-10.) Folded OUT of ``mgr_policy`` into its own
    # loss key (``goal_duration_prior``, own ``loss_scales`` entry), matching how
    # ``mask_sparsity`` gets an independent scale -- unlike the fixed/``_adapt``
    # paths above, which share ``policy``'s scale. Mutually exclusive with
    # ``goal_duration_adapt`` (this takes priority if both are set).
    # 0/False = off (use the paths above).
    goal_duration_lagrange: False
    goal_duration_lagrange_tol: 0.1
    goal_duration_lagrange_impl: mult
    goal_duration_lagrange_min: 1e-5
    goal_duration_lagrange_max: 5.0
    goal_duration_lagrange_vel: 0.1
    goal_duration_lagrange_init: 1.0
    # Force a constant goal duration (in steps) through the variable-K machinery,
    # bypassing the duration head sample. >0 enables; used as a control (variable
    # training graph at a fixed K, no duration prior). 0 = use the emitted duration.
    goal_duration_fixed: 0
    # Optional per-decision cost subtracted from the manager extrinsic reward at each
    # switch step (discourages churning short goals, HiTS-style). 0 = advantage alone
    # shapes the duration.
    goal_switch_cost: 0.0
    # Manager extrinsic-reward block aggregation: 'mean' (per-step average, original)
    # or 'sum' (continuation-weighted SMDP option return). Under per-step block
    # discounting 'mean' under-credits long blocks (short-K bias); 'sum' is K-neutral.
    mgr_reward_agg: mean
    # Hindsight-relabel a block-pooled decision's duration class when the
    # imagination horizon cuts its hold short (rather than a real switch), so
    # REINFORCE credits the duration actually realized, not the sampled one.
    # Only meaningful under variable_goal_length (block pooling is always on
    # there). Default True
    # (the fix); ablate by setting False.
    goal_duration_relabel_truncated: True
    # How the manager POLICY term treats a hold cut short by the imagination
    # horizon: keep (historical; pairs with goal_duration_relabel_truncated) |
    # drop_duration (withhold only the duration head's log-prob there -- the
    # only action that provably did not execute; the critic target and the
    # skill advantage are valid n-step quantities either way) | drop_decision
    # (withhold the whole decision's policy credit). The critic is never gated.
    goal_duration_truncated_policy: keep
    worker_report_horizon: 32
    worker_split_traj: True
    mgr_expl_weight: 0.1
    # Weight on the count-novelty advantage (agent.mgr_novel). Negative means
    # "same as mgr_expl_weight", which is the original equal-weight behaviour.
    # Set it lower to stop the count bonus from crowding out the
    # reconstruction-error bonus before the first task reward is found.
    mgr_novel_weight: -1.0
    # Selection-time UCB over the goal code: when the manager picks a goal in
    # the environment rollout, draw `mgr_ucb_candidates` samples from its own
    # policy and keep the one maximising `logp + mgr_ucb_c * 1/sqrt(count+1)`.
    # 0 disables (default). This is NOT a reward -- nothing bootstraps it, so
    # the manager's learned objective stays pure task reward and the tilt fades
    # by itself as counts fill in. Needs no weight schedule for that reason.
    # Scale note: logp of an 8-block code spans several nats between candidates
    # while the bonus is in (0, 1], so `mgr_ucb_c` must be of order 1-10 to
    # matter at all. Uses the same count table as `mgr_novel` and can run
    # without it.
    mgr_ucb_c: 0.0
    mgr_ucb_candidates: 8
    # Probability that a manager decision in the ENVIRONMENT rollout is
    # replaced by a deliberate large index jump from its mode (hrl/explore.py).
    # 0 disables. Only meaningful on an ordered codebook (SOM on a line).
    mgr_explore_eps: 0.0
    manager_actent: 3e-4
    # Director ``actent`` adaptive scale on per-dim normalized manager entropy.
    manager_actent_impl: mult
    manager_actent_target: 0.5
    manager_actent_duration_target: -1.0  # <0 inherits manager_actent_target; raise (e.g. 0.8) to keep the variable-K duration head exploratory (anti short-K collapse)
    manager_actent_min: 1e-5
    manager_actent_max: 1e2
    manager_actent_vel: 0.1
    manager_actent_init: 1.0
    manager_actent_perdim: True
    # Rao's quadratic entropy on the manager's skill head. Entropy fixes how
    # MUCH mass the manager spreads; Rao fixes how far apart, along the ordered
    # SOM codebook, the classes carrying it are. Q = sum_{a,b} p_a p_b d(a,b),
    # normalized so 1.0 = half the mass on each of the two most distant classes.
    # Distances run along the SOM line, so this is only meaningful when the
    # class index carries order: the measured ratio against shuffled class
    # labels is 0.43 for SOM-line+LiP but 1.06 for Director (arbitrary indices). Whole-code Rao is the
    # sum of these per-block Raos exactly (independent blocks, additive
    # distance), so nothing here touches the 8^8 = 16.7M code space.
    #
    # Reference values at C=8 on a line: one class 0.0, three ADJACENT classes
    # 0.054, uniform 0.429, half at each end 1.0. The e534-e573 arm measures
    # 0.125 against a ceiling of 0.925 at the entropy it already holds.
    # NOTE manager_rao_target 0.5 is ABOVE uniform (0.429), so it demands an
    # end-heavy shape and not merely a wider one: at entropy 0.5 the solutions
    # look like ~0.25 / 0.5 / 0.25 on classes 0 / middle / C-1.
    manager_rao: False
    manager_rao_impl: mult
    manager_rao_target: 0.5
    manager_rao_min: 1e-5
    manager_rao_max: 1e2
    manager_rao_vel: 0.1
    manager_rao_init: 1.0
    manager_rao_perdim: True
    # Count-based novelty as a THIRD manager reward, with its own critic
    # (mgr_novel_val), carried alongside the reconstruction-error exploration
    # bonus rather than replacing it. Both exploration advantages enter at
    # mgr_expl_weight, so the TOTAL exploration pull is 2 * mgr_expl_weight
    # against the task reward.
    #
    # Counting only needs the goal encoder to LABEL a state consistently, not to
    # reconstruct it. That is why this works where boosting the codes of
    # high-reconstruction-error states does not: a novel state's code is exactly
    # the code that fails to decode back to it.
    #
    # decay and insertion weight are DERIVED in agent.py from replay.size,
    # train_ratio and the batch shape -- deliberately not set here -- so the
    # memory forgets at exactly the rate replay forgets, and a count reads as
    # "env steps spent near this code inside the replay window".
    mgr_novel: False
    mgr_novel_count:
      # Grid resolutions, from measured occupancy growth (experiments/
      # manager_rao). Writing alpha for the exponent in occupancy ~ n^alpha,
      # alpha is 0.39/0.61/0.74/0.83/0.87 at 2/3/4/5/6 bins and the p90/p10
      # count ratio falls 46.9 -> 2.6. alpha -> 1 puts every visit in its own
      # cell and pins the reward at its maximum; a saturating grid stops
      # discriminating. 4 bins keeps a 5.3x count spread at a 256-fold
      # reduction of the 8^8 space; 2 bins saturates, which is what makes the
      # coarse grid a REACHABILITY test rather than a second novelty measure.
      fine_bins: 4        # 4^8 = 65,536 cells, 256 KB
      coarse_bins: 2      # 2^8 = 256 cells, 1 KB
      # Grid for the SELECTION table (UCB only). Coarser than the visit grid on
      # purpose: the bonus must ANNEAL, which needs the grid to fill. At 4 bins
      # there are 65,536 cells against ~500k decisions per 4M run, so a
      # never-selected candidate at bonus 1.0 always exists, the candidate
      # spread never shrinks, and the override rate RISES over training
      # (measured 67% -> 75% between 100k and 300k). At 3 bins each cell takes
      # ~76 selections, so counts saturate and the spread compresses.
      select_bins: 4      # 4^8 = 65,536 cells, 256 KB
      # Kernel width in CLASS units (a block has 8 classes); 0 = hard grid.
      # Chosen by sweeping (bins, h, c) against the manager's REAL per-state
      # probabilities from finished checkpoints, scoring how the override rate
      # evolves over a run. Hard grids do not anneal (b=4 gives a flat 38/38/38
      # across 50k/250k/500k decisions, b=5 rises 43/47/48). Full resolution is
      # worse still: at b=8 mass is so diluted that every candidate scores ~1.0
      # early and the rate RISES 5-18x, inverting the schedule. b=4 with h=1.0
      # anneals cleanly, 46/36/22 at c=7.5.
      select_h: 1.0
      # A cell counts as occupied past this much mass, in env-step units. Must
      # not be 0: decayed cells approach zero without reaching it, so a >0 test
      # would count every cell ever touched and creep upward forever.
      occ_thresh: 1.0
      eps: 1.0
      # Frontier gating: damp the bonus where the COARSE grid is also empty, so
      # it points just outside the explored set rather than at the farthest and
      # typically unreachable corner. Off by default so the first test moves one
      # thing at a time.
      frontier: False
      # Emit the 256x256 fine / 16x16 coarse coverage pictures. Costs a
      # device transfer every train step (the jit metrics dict has a static
      # key set, so it cannot be strided), so off unless the picture is
      # wanted. NOT in report(): the production sbatch sets agent.report
      # False, so report-only metrics never reach a real run.
      log_images: False
    manager_slowtar: False
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 16
    horizon: 333
    contdisc: True
    imag_loss:
      slowtar: False
      lam: 0.95
      actent: 3e-4
      slowreg: 1.0
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    # Manager and worker actor-critics both use these DreamerV3 defaults: the
    # ``perc`` retnorm scales the advantage by the 5-95 percentile return range,
    # ``valnorm: none`` trains the symexp_twohot critic on RAW returns (the head's
    # symlog transform handles scale), and ``advnorm: none`` leaves the advantage
    # at that perc scale. This is the proven flat-v3 normalization, applied
    # identically to every AC head so the default v3 hyperparameters transfer.
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    # Manager-only retnorm override. ``meanstd`` scales the manager advantage by
    # the running return std (Director's original ``retnorm: std``); the mean
    # offset it returns is unused by the manager advantage path (``roff_*`` is
    # discarded), so this is std-only scaling. Worker and flat heads keep the
    # ``perc`` retnorm above.
    mgr_retnorm: {impl: meanstd, rate: 0.01, limit: 1e-8, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False
    # Subset of HRL goal-proposal modes to render videos for. Director's original
    # list was ['manager','prior','replay']. Per-impl gating is via the bool
    # flag below — the list type just stays non-empty so elements.Config can
    # infer its element type.
    report_impl_videos: [manager]
    report_impl_videos_enabled: False
    # Limit number of replay rows visualised in report() videos (was hardcoded 6).
    report_max_rows: 4
    # Render the per-step vec-to-rgb summary of deter/skill tensors. These are
    # debug visualisations and dominate report() time on small models; default off.
    report_vec_viz: False
    # Render the goal-VAE-reconstruction panel from manager-proposed goals. Same
    # information as the openloop ``goal/recon`` panel just via a different goal
    # source; off by default to halve the goal/* video count.
    report_mgr_recon: False
    # Subsample report videos before W&B/TB encoding. ``time_stride: 8`` keeps
    # every 8th frame and roughly 8×s the per-video encode cost; combined with
    # the impl/mgr_recon/vec-viz trims and the bumped ``report_every`` it brings
    # overall GIF cost down ~10× relative to the original defaults.
    report_video_time_stride: 1
    report_video_space_stride: 1
    # 3-row skill viz [skill heatmap | deter heatmap | decoded goal image] and
    # 5-row goal encoder viz [og | enc_deter | enc_goal | dec_deter | dec_image].
    # Both appear under skill_viz/ and goal_enc_viz/ in WandB.
    report_skill_viz: True
    report_goal_enc_viz: True
    # Offline goal-code structure diagnostics (volatility + on-manifold splice test);
    # off by default, enabled only by the diag driver. See Agent._code_diag.
    report_code_diag: False
    # Decode goal image at every policy step and stack with obs for episode rollout.
    # Logged as epstats/policy_image_with_goal. Adds one decoder forward pass per step.
    policy_goal_image: True
    # Emit the current-state deter vector and its soft goal-code (goal_enc output)
    # at every policy step, under log/struct_diag_*. Off by default; used only by
    # experiments/goal_code_struct_corr/diag_goal_struct_corr.py to correlate
    # goal-space vs. goal-code geometry on a live rollout (no gradient/training
    # effect -- pure forward pass).
    policy_struct_diag: False

variable_goals: &variable_goals
  agent.use_hrl: True
  agent.variable_goal_length: True
  agent.imag_length: 32

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64
  batch_size: 16
  batch_length: 64

size6m: &size6m
  .*\.rssm: {deter: 1024, hidden: 128, classes: 8}
  .*\.depth: 8
  .*\.units: 128
  batch_size: 4
  batch_length: 32

size6m_director: &size6m_director
  .*\.rssm: {deter: 1024, hidden: 128, classes: 8}
  .*\.depth: 8
  .*\.units: 256
  batch_size: 2
  batch_length: 32

# Director defaults parity (TF Director configs.yaml): RSSM deter/hidden 1024,
# classes 32, CNN depth 64, 4-layer 512-wide MLP heads. Use with 64x64 DMC.
director_match: &director_match
  .*\.rssm: {deter: 1024, hidden: 1024, classes: 32}
  .*\.depth: 64
  batch_size: 4
  batch_length: 32

# --- Director's actor-critic stabilizers, which director_match never carried ---
#
# `director_match` sets network SIZES only; everything else stayed at DreamerV3
# defaults. Four of those defaults are what let the pinpad_five Director seeds
# e652-e655/e676 peak near 215 by 1M steps and then decay to ~83 by 3.75M, with
# two of five seeds driving the manager's task critic to impossible values
# (mgr_extr_val reached -23 on e654 and -210 on e655, on a task whose reward is
# 0 or +10 and can never be negative). Measured against TF Director:
#
#  1. manager_slowtar. We bootstrap the manager critic off ITSELF -- both the
#     critic target and the actor's advantage read the live critic, with the
#     slow copy only a soft `slowreg` pull (hrl/losses.py:241). TF Director's
#     VFunction.target() reads `self.target_net`, a separate network hard-copied
#     every 100 updates (slow_target_update: 100, slow_target_fraction: 1.0,
#     adv_slow_critic: True). Once pinpad's sparse task reward stops arriving,
#     nothing anchors our critic but its own output, and it runs away.
#  2. advnorm. Director normalizes TWICE: each reward stream by its own running
#     std, then the WEIGHTED SUM by running mean and std (agent.py:329-337,
#     advnorm: {impl: mean_std, decay: 0.99}). Ours had that second stage set to
#     `none` -- offset 0, scale 1 -- so the manager's policy-gradient magnitude
#     floated free. Measured on e652-e676: median mgr_adv_std ~0.3 with peaks of
#     10.3/10.5/14.7, i.e. updates 30-50x normal size. It also removes the
#     persistent -0.5..-0.85 offset our exploration advantage carries, which
#     comes from that reward being non-stationary downward (visit a region, the
#     goal AE learns it, the bonus there decays, so the critic over-predicts).
#     `advnorm` is shared by the manager and the worker; Director's is too,
#     since every ImagActorCritic builds one.
#  3. mgr_retnorm.limit. Director floors the per-stream return std at 1e-2
#     (retnorm: {impl: std, max: 1e2} -> var floored at 1/max^2). Ours floored
#     it at 1e-8, six orders of magnitude lower, so a task stream with almost no
#     spread left divides the advantage by ~0.
#  4. Weight decay. Director runs wd 1e-2 with wd_pattern 'kernel' on all four
#     of its optimizers. Ours ran wd 0.0 on all three, and nothing else bounds
#     parameter norm: over e654's 4M steps the actor-critic parameter RMS grew
#     0.046 -> 0.109 (2.4x, still a straight line at the end), the world model
#     0.0293 -> 0.0386, the goal AE 0.0563 -> 0.0656. The goal AE reconstructs
#     `deter` with a summed MSE, so a growing `deter` scale grows that error with
#     no bug anywhere: goal/rec_mean went 6.4 -> 52. That error IS the manager's
#     exploration reward (`adver`, squared), and mgr_expl_rew tracked it exactly
#     (0.0069 -> 0.0559, the same 8x). So the manager's second objective grew in
#     absolute size for the whole run instead of converging.
#     2.5e-2 not 1e-2: both implementations are decoupled (Director assigns
#     `var *= (1 - wd*lr)`; ours appends optax.add_decayed_weights after the RMS
#     and momentum stages, so the step is -lr*wd*param). Effective shrinkage is
#     therefore wd*lr, and our lr is 4e-5 against Director's 1e-4. 2.5e-2 * 4e-5
#     matches their 1e-2 * 1e-4 = 1e-6 per step. `wdregex` already defaults to
#     '/kernel$', which is Director's wd_pattern.
#
# Still NOT matched, deliberately, so this block stays a four-factor change:
# mgr_retnorm.rate is 0.01 (a 100-batch EMA) against Director's decay 0.999
# (1000 batches), mgr_retnorm.debias is False against Director's always-on bias
# correction, and imag_loss.slowtar / repl_loss.slowtar stay False so only the
# MANAGER critic changes its bootstrap (the worker's cosine_max goal reward is
# bounded in [0,1] and its critic stayed healthy in every seed).
director_stable:
  agent:
    manager_slowtar: True
    advnorm: {impl: meanstd}
    mgr_retnorm: {limit: 1e-2}

# reported as goal/used_frac and goal/perplexity.
goal_vq:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: False, lip: False}

goal_som:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: False}

goal_lipvq:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: False, lip: True}

goal_som_lipvq:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True}

# som+lipvq plus a manager whose logits are distances to the codebook, so the
# ring is usable by the policy and not only by the decoder.
goal_som_lipvq_mgr:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, mgr_ring: True}

# som+lipvq on an open path, with the distance-parameterized manager head.
#
# The alternative to mgr_smooth, and the one that survives the arithmetic.
# Smoothing edits the CREDIT after the fact, independently per block, so the
# weight landing on the code actually executed is (1-2a)^L: 17% at a=0.1, 0.4%
# at a=0.25 (e479/e482 both returned 0). Reaching 90% needs a=0.0065, at which
# each neighbour receives 0.65% -- no sharing left. There is no useful a.
#
# ManagerRingHead instead changes the POLICY CLASS: the trunk emits a point per
# block and logits are negative squared distances to the codebook entries, so
# the executed code keeps 100% of its credit and neighbours rise because they
# are genuinely nearby. Pairs with topology: line, whose adjacent-to-arbitrary
# distance ratio (0.333 vs a ring's 0.533) gives the distances a wider range to
# express.
# The original SOM-VAE loss, exactly as written in motivation.tex Eq. 12, on an
# open-path codebook:
#
#   ||x - dec(e_k)||^2 + ||x - dec(z_e)||^2
#     + alpha ||z_e - e_k||^2
#     + beta  sum_{e' in N(e_k)} ||e' - sg[z_e]||^2
#
# No straight-through estimator (ste off), the commitment term as a single
# undivided term (commit_joint), no Lipschitz. alpha=1.0, beta=0.9 are the
# official SOM-VAE weights.
#
# The ring version of this ran once as e415's first launch (job 4675914) and
# collapsed over 577k steps: perplexity 1.57 -> 1.28 of a possible 8, used_frac
# 0.32 -> 0.41, and reconstruction error rising 5.1 -> 35.7. This arm asks
# whether the line topology changes that.
goal_som_orig_line:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: False, topology: line, ste: 'off', commit_joint: True}

# The same original SOM-VAE loss as goal_som_orig_line, plus the LipVQ weight
# normalization and penalty. Differs from goal_som_orig_line by lip alone, so
# the pair isolates the Lipschitz component under the pure SOM-VAE objective.
# Launch with COMMIT_SCALE=0.25 to match its sibling.
# Pure SOM-VAE on a line, with the commitment weight under a controller instead
# of fixed. Answers "what commitment weight does the system want" rather than
# testing one value, and so is a complement to the e488-e492 fixed sweep rather
# than a member of it. The weight it settles on is the largest that holds
# codebook perplexity at the target.
goal_som_orig_line_adapt:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: False, topology: line, ste: 'off', commit_joint: True, commit_adapt: True}

goal_som_orig_lipvq_line:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, topology: line, ste: 'off', commit_joint: True}

# Liu et al. (SIGGRAPH 2022) exactly as written, on top of the pure SOM-VAE
# line. Differs from goal_som_orig_lipvq_line by the four places our default
# departed from the paper, and by nothing else:
#
#   lip_per_row: False  Sec. 4.1.1 gives "a trainable Lipschitz bound c_i for
#                       layer i" -- ONE scalar per layer, broadcast against the
#                       vector of row sums. Our per-unit default made the
#                       penalty reach 1 of 1024 bounds per layer (`bound()`
#                       reduces with max, whose gradient is a one-hot).
#   lip_impl: prod      Eq. (10), alpha * prod_i softplus(c_i). Our `logprod`
#                       is their Eq. (14), which they consider and reject.
#   lip_scale: 1.1e-11  Their alpha. It is swept per task in the paper, and the
#                       form change moves its scale entirely. Taken from the
#                       measured value rather than estimated: e481 logs
#                       lip_penalty = 24.93 at init (BIG scale), and that IS
#                       log(prod), so prod = e^24.93 = 6.7e10. Do not estimate
#                       it as bound_max^8 -- the 8 constrained layers have
#                       different input widths (the encoder's first takes deter
#                       at 8192), so their bounds are not equal, and 27.9^8
#                       overstates it by 5x. 1.1e-11 * 6.7e10 = 0.75, the same
#                       absolute contribution 0.03 * logprod had, against a
#                       goal-AE reconstruction of ~25 (3%). So this arm differs
#                       from its sibling in the FORM of the penalty, not its
#                       size.
#                       Unlike `logprod`, `prod` is self-limiting: the gradient
#                       on each bound is prod(others), which collapses as the
#                       bounds fall, so a too-large alpha settles rather than
#                       running away.
#   act: relu           Eq. (2)'s product-of-bounds is a bound on the network
#                       only for a 1-Lipschitz activation ("e.g. ReLU"). SiLU
#                       peaks at ~1.0998, so with 3 hidden layers our composed
#                       bound understated the true constant by ~1.33x and
#                       `strict_bound` did not deliver what it claims.
#
# Everything else already matched the paper: the min(1, .) clamp (lip_clamp),
# normalization applied in the forward pass with the raw weights left
# unconstrained ("we never clip the weights during training"), norm=none so the
# per-layer bounds compose, and the reduction axis (ours is theirs transposed,
# since our kernel is (in, out) and theirs is (out, in)).
goal_som_orig_lipvq_line_paper:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq_enc: {act: relu}
    goal_vq_dec: {act: relu}
    goal_vq: {som: True, lip: True, topology: line, ste: 'off', commit_joint: True,
              lip_per_row: False, lip_impl: prod, lip_scale: 1.1e-11}

# --- The e510-e549 comparison family (launched 2026-08-10) -------------------
#
# Five arms, each a single-factor change from its neighbours, run on
# cartpole_swingup and hopper_stand against the e502-e509 Director baselines:
#
#   goal_som_line                  SOM on a line, straight-through ON
#   goal_som_orig_line             SOM on a line, straight-through OFF (Eq. 12)
#   goal_lipvq_prod                Lipschitz only, no SOM               <- new
#   goal_som_lipvq_line_prod       SOM-line (STE on)  + Lipschitz       <- new
#   goal_som_orig_lipvq_line_prod  SOM-line (STE off) + Lipschitz       <- new
#
# The three new blocks take the Lipschitz penalty in the form Liu et al. write
# it, which is what `goal_som_orig_lipvq_line_paper` established:
#
#   lip_per_row: False   one trainable scalar bound per LAYER, not per output
#                        unit. Under the per-unit default `bound()` reduces
#                        with `max`, whose gradient is a one-hot, so the
#                        penalty pulled on 1 of 1024 bounds per layer.
#   lip_impl: prod       Eq. (10), alpha * prod_l softplus(c_l) -- the actual
#                        Lipschitz bound of the network, and self-limiting
#                        (each bound's gradient is the product of the others,
#                        which collapses as the bounds fall). `logprod` is
#                        their Eq. (14), which they consider and reject.
#   lip_scale: 1.1e-11   their alpha, calibrated to the measured prod at init
#                        (e481 logs logprod = 24.93 at BIG scale, so prod =
#                        e^24.93 = 6.7e10; 1.1e-11 * 6.7e10 = 0.75, the same
#                        absolute contribution 0.03 * logprod had). The arms
#                        therefore differ in the FORM of the penalty, not its
#                        size at initialization.
#
# They deliberately do NOT take the paper arm's fourth change, `act: relu`.
# The activation is not part of the Lipschitz mechanism being tested, and
# changing it here would confound every LiP-vs-no-LiP contrast in the family
# (goal_som_line vs goal_som_lipvq_line_prod, goal_som_orig_line vs
# goal_som_orig_lipvq_line_prod) with an activation change. The cost of keeping
# silu is that its slope peaks at ~1.0998, so the composed bound understates
# the true constant by ~1.0998 per activation (~1.33x over the 3 hidden
# layers); the penalty still shrinks exactly the quantity it claims to, just
# against a bound that is not tight. `goal_som_orig_lipvq_line_paper` remains
# the arm for the fully paper-faithful version.

# Lipschitz alone: the blockwise quantizer with the weight normalization and
# penalty, and no SOM neighbourhood term. Straight-through stays ON (the
# default): `ste: off` with `som: False` is the released LipVQ-VAE code, which
# has no second reconstruction to carry gradient to the encoder and collapses
# outright (perplexity 1.00, see goal_vq.ste). Topology is left at its default
# because with som=False no neighbourhood term is emitted and it is inert.
goal_lipvq_prod:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: False, lip: True,
              lip_per_row: False, lip_impl: prod, lip_scale: 1.1e-11}

# goal_som_line + Lipschitz. Differs from goal_som_line by `lip` alone.
goal_som_lipvq_line_prod:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, topology: line,
              lip_per_row: False, lip_impl: prod, lip_scale: 1.1e-11}

# goal_som_orig_line + Lipschitz. Differs from goal_som_orig_line by `lip`
# alone, and from goal_som_orig_lipvq_line_paper by the activation alone.
goal_som_orig_lipvq_line_prod:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, topology: line, ste: 'off', commit_joint: True,
              lip_per_row: False, lip_impl: prod, lip_scale: 1.1e-11}

goal_som_lipvq_line_mgr:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, topology: line, mgr_ring: True}

# Line (open path) instead of a ring, no manager changes.
goal_som_line:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: False, topology: line}

# Unimodal Poisson manager policy (Zhu et al. 2024, Eqs. 8-10). Orthogonal to
# the goal-AE arm: layer it ON TOP of an arm whose class axis is ordered, i.e.
#   --configs director_match goal_som_line mgr_poisson
#
# The manager's per-block head stops emitting C free logits and emits two
# scalars instead -- a Poisson rate (which class, monotone in the rate) and a
# temperature (how sure). The resulting categorical is unimodal by
# construction, so REINFORCE credit for class j automatically spreads to j-1
# and j+1 and decays with distance. On a SOM line that is exactly the metric
# the codebook was trained to have, so the manager inherits the ordering
# instead of having to rediscover it.
#
# Only meaningful with topology: line (or ring, with the caveat that a Poisson
# is not periodic and so cannot wrap). On an UNORDERED codebook this is a pure
# restriction of the policy class and should be expected to hurt.
#
# manager_actent is unchanged and still needed -- see the PoissonOnehot
# docstring for why the temperature output is what makes it well posed.
#
# tau_min is 0.02, NOT the 0.1 this was first written with, and the difference
# is the whole run. At exactly integer lam two adjacent classes are tied
# (h_j = h_{j+1} <=> lam = j+1), so as tau -> 0 the pmf collapses to 50/50 on
# that pair rather than to a one-hot: the normalized entropy has a hard floor
# of log2/log8 = 0.333 there. At tau_min=0.1 the floor over lam is 0.546 --
# ABOVE manager_actent_target=0.5 -- so the entropy the controller is asked to
# reach is unreachable and its multiplier rails, which is exactly how e479 was
# lost (that time to a smoothing kernel whose floor was also 0.5). At 0.02 the
# floor is 0.334 and the target has real headroom.
mgr_poisson:
  agent:
    manager_policy: {output: poisson, tau_init: 1.0, tau_min: 0.02}

# Unimodal DISCRETIZED GAUSSIAN manager policy. Same contract as mgr_poisson --
# two scalars per block, unimodal, mode monotone in the first -- but the two
# scalars are orthogonal: loc is which class, scale is how sure.
#
#   --configs director_match goal_som_lipvq_line_prod mgr_gaussian
#
# Preferred over mgr_poisson at THIS scale. Zhu et al. choose the Poisson
# because it needs M output units where a categorical needs M*K, which matters
# at their Humanoid scale (17 dims x 11 bins). At L=8, C=8 that saving is
# 32768 -> 8192 parameters in one Linear layer, and the temperature already
# costs a second scalar, so both heads emit 16 numbers. With the parameter
# argument gone, two measured Poisson defects remain (both from its variance
# being tied to its mean): it cannot be equally confident about every class
# (min normalized entropy 0.025/0.055/0.098 on classes 4/5/6, versus 0
# everywhere here), and its credit is always skewed (best achievable
# |log p(mode+1)/p(mode-1)| at entropy 0.5 is 0.15-0.37 versus 0.01-0.06 here).
#
# scale_min is 0.3 for the same reason tau_min is 0.02: at loc exactly halfway
# between two classes they tie, so the normalized entropy floors at
# log2/log8 = 0.333 however small the scale gets. At 0.3 the floor over loc is
# 0.334, safely under manager_actent_target = 0.5; at 0.6 it is 0.442, which
# leaves the entropy controller almost no headroom.
mgr_gaussian:
  agent:
    manager_policy: {output: gaussian, scale_init: 2.0, scale_min: 0.3}

# Unimodal STUDENT-T manager policy: mgr_gaussian with polynomial tails.
#
#   --configs director_match goal_som_lipvq_line_prod lip_relu mgr_studentt
#
# Same two scalars and the same contract as mgr_gaussian -- nu -> inf IS the
# Gaussian -- so this is a one-parameter generalization, not a replacement.
#
# WHAT IT IS FOR. The point of a SOM line is that the index is ordered, so the
# manager can reach a distant code by WALKING the mean rather than by finding
# it. Walking needs the far region to say which direction is better. Under the
# Gaussian it cannot: at the regulated entropy a class 4 steps out has
# probability 2.3e-08, ~0.01 draws over a 4M-step run, so nothing is ever
# observed out there. Adding unimix puts mass there but FLAT mass -- at 0.075
# classes 0, 6 and 7 all sit at u/C = 0.0094 -- which carries no ordering, and
# a draw from the uniform component has d log p / d loc ~ 0 because that
# component does not depend on loc. It teaches the critic about far codes but
# cannot steer the policy toward them.
#
# A Student-t tail decays monotonically to the edge of the codebook, so the
# ordering survives and a distant draw DOES move the mean. Measured at C=8,
# entropy 0.5, mode at class 3 (see outs.StudentTOnehot), per 4M-step run:
#
#   nu     sigma   nbr     p(class7)  dp7/dloc  steering  d>=20/run  tie floor
#   1      0.400   0.099   7.1e-03    3.5e-03   3.65        400      0.601  XX
#   2      0.482   0.123   3.3e-03    2.4e-03   4.82         55      0.446
#   2.5    0.509   0.132   2.3e-03    1.9e-03   5.16         24      0.405  <-
#   3      0.530   0.140   1.7e-03    1.6e-03   5.40         11      0.379
#   inf    0.685   0.201   2.3e-08    2.0e-07   6.47          0.0    0.333
#
# NU = 1 (A TRUE CAUCHY), AND THE BLOCK RAISES THE ENTROPY TARGET TO 0.7 TO
# MAKE IT FEASIBLE. At a tie -- loc exactly between two classes -- shrinking
# the scale does not give a one-hot: the limit is p_j/p_mode ->
# (d_mode/d_j)^(nu+1), so the floor is set by nu, NOT by scale_min. nu=1 floors
# at 0.601 (the tie floor column above is the floor actually REACHABLE at
# scale_min 0.1; the s -> 0 limit is 0.595), which is ABOVE the default target
# of 0.5 -- at 0.5, 22.7% of the loc range, not a measure-zero set, would be
# stuck above target with the adapter railing as in e479.
#
# Two ways out, and we take the second:
#   nu > 1.558 at target 0.5  -- keeps the single-factor comparison against the
#                mgr_gaussian arms, but nu=2.5 gives up most of the reach.
#   nu = 1 at target 0.7      -- 0.10 of headroom, and at a MATCHED entropy of
#                0.7 the Cauchy beats the Gaussian on every count: mode 0.525
#                vs 0.384 (more decisive), mode/neighbour 3.35 vs 1.59 (better
#                ordering than the Gaussian has even at 0.5), p(class7)
#                1.4e-02 vs 2.3e-04, and ~7500 vs ~400 decisions per run at
#                index distance >= 20.
# The cost of the second is that it is no longer single-factor against the
# existing mgr_gaussian arms, which all run target 0.5; pair it with a
# Gaussian-at-0.7 arm if the target effect has to be separated from the head.
#
# COSTS, both real. The tail spends entropy, so the adapter tightens sigma and
# the core sharpens: the immediate neighbour falls 0.201 -> 0.132, and total
# steering power sum_j |d p_j/d loc| over the L blocks falls 6.47 -> 5.16. The
# Gaussian concentrates all its steering at distance 1; this spreads it across
# every distance. Move nu to trade reach against margin.
#
# scale_min 0.10, NOT the Gaussian's 0.3 -- a SEPARATE floor from the tie bound
# above, and the one that scale_min does fix. A heavy tail keeps leaking mass,
# so at 0.3 a confident state floors at 0.222 (the Gaussian floors at 0.012).
# By scale_min at nu=2.5: 0.30 -> 0.222, 0.20 -> 0.087, 0.15 -> 0.040,
# 0.10 -> 0.013, which matches the Gaussian's ability to commit.
mgr_studentt:
  agent:
    manager_policy: {output: studentt, nu: 1.0, scale_init: 2.0, scale_min: 0.1}
    # Raised from the default 0.5: nu=1's tie floor is 0.601, so 0.5 is
    # unreachable and 0.6 lands 0.001 under it. This is part of the arm, not a
    # separate knob -- changing nu without changing this rails the adapter.
    manager_actent_target: 0.7

# eps-greedy index jump in the environment rollout, 10%.
#
#   --configs director_match goal_som_lipvq_line_prod lip_relu mgr_gaussian mgr_explore
#
# The Gaussian concentrates on classes next to its mode, which is what makes
# credit transfer and equally what limits reach: two codes drawn in the same
# state differ by only ~5.7 of the 56 index steps and decode to goals ~0.84
# similar. That trade-off lives on the entropy knob, so neither raising
# manager_actent_target nor adding unimix escapes it -- at target 0.8 the
# mode/neighbour ratio collapses from 2.9 to 1.27, and a uniform mixture is
# cancelled by the controller shrinking sigma (measured: unimix 0.05 moves the
# gap 5.6 -> 5.8, and unimix 0.2 pushes the entropy floor to 0.597, above the
# 0.5 target, which rails the multiplier as in e479).
#
# The jump buys reach on a separate axis: p(d) = 2d/[dmax(dmax+1)] draws
# d ~ 30, which by the measured index curve lands at ~0.49 goal similarity.
# See hrl/explore.py.
mgr_explore:
  agent:
    mgr_explore_eps: 0.1

# ReLU in the goal-AE trunk, as an overlay so it composes with any LiP arm:
#
#   --configs director_match goal_som_lipvq_line_prod lip_relu mgr_gaussian
#
# This is what makes the Lipschitz claim exact. `prod_l softplus(c_l)` bounds
# the network's inf-norm Lipschitz constant only when the activations are
# 1-Lipschitz. relu is; silu's slope peaks at ~1.0998, so on the 4-layer trunk
# these runs use, the silu arms' composed bound understates the true constant
# by up to 1.0998^4 = 1.46. With relu the reported product IS the bound.
#
# The e510-e549 family deliberately kept silu so that every LiP-vs-no-LiP
# contrast was a single-factor change; this block is for the case where a
# correct bound matters more than that contrast.
lip_relu:
  agent:
    goal_vq_enc: {act: relu}
    goal_vq_dec: {act: relu}

# Rao regularizer on the manager's skill head, held at a normalized Rao of 0.5
# by an AutoAdapt Lagrange multiplier, alongside the unchanged 0.5 entropy
# target. Distances are measured along the SOM LINE, so layer this only on a
# line arm -- on Director's unordered codebook the class index means nothing
# and the term would regulate noise (measured shuffle ratio 1.06 there,
# against 0.43 on SOM-line+LiP).
#
# 0.5 is a demanding setpoint: it sits above the uniform value of 0.429, so the
# manager cannot satisfy it by widening a unimodal distribution -- it has to put
# mass at both ends. If it proves too aggressive, lower manager_rao_target
# (0.25-0.3 is still 2x the measured 0.125 and stays below uniform) or ratchet
# it up over training rather than starting there.
# Count-based novelty as a third manager reward + critic. Layer on any HRL arm.
mgr_novel:
  agent:
    mgr_novel: True

# The same, with the count bonus down-weighted so it stops crowding out the
# reconstruction bonus before the first task reward is found. At equal weights
# the count term took ~50% of the manager's exploration signal on pinpad_five;
# at 0.03 it takes ~24%, close to Director's recon-only balance.
# Counts used ONLY to tilt goal selection -- no reward, no third critic.
# The count table is built and updated exactly as in mgr_novel.
mgr_ucb:
  agent:
    mgr_novel: False
    # 3-bin selection grid (6,561 cells) rather than the 4-bin visit grid. With
    # 4 bins there are 65,536 cells against ~500k decisions, so the grid never
    # fills, a bonus-1.0 candidate always exists, and the tilt SHARPENS over
    # training (measured 67% -> 75% override rate between 100k and 300k) instead
    # of annealing. At 3 bins each cell takes ~76 selections, counts saturate and
    # the spread compresses.
    # c=5 from MEASURED override rates, not the earlier arithmetic. That
    # derivation assumed a candidate bonus spread of 0.05-0.10 and gave c=20;
    # the real spread is ~0.85, because candidates range from heavily-visited
    # cells (bonus ~0.1) to never-visited ones (1.0). So c=20 was ~10x too high.
    # Weight on the novelty term when RESAMPLING among the policy's candidates
    # (see hrl/explore.py:ucb_pick). Measured on the manager's real per-state
    # probabilities with the smeared b=4 table: c=10 picks goals 1.3-1.5x rarer
    # than the candidate average while costing ~1.4 nats of log-probability out
    # of 9.5, and returns diminish sharply above it (c=20 buys 1.7x for 1.9
    # nats). c=0 reproduces an exact policy sample.
    mgr_ucb_c: 10.0
    mgr_ucb_candidates: 8

mgr_novel_lowweight:
  agent:
    mgr_novel: True
    mgr_novel_weight: 0.03

# The same, with the reachability gate on.
mgr_novel_frontier:
  agent:
    mgr_novel: True
    mgr_novel_count: {frontier: True}

mgr_rao:
  agent:
    manager_rao: True
    manager_rao_target: 0.5

goal_som_lipvq_line:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, topology: line}

# som+lipvq with ring-smoothed REINFORCE credit. Differs from goal_som_lipvq by
# the single number mgr_smooth, so the comparison isolates credit assignment.
goal_som_lipvq_smooth:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, mgr_smooth: 0.25}

# som+lipvq on an open path, with the REINFORCE credit smoothed over the path's
# neighbours (endpoints renormalized -- see heads.smooth_skill_event).
#
# mgr_smooth is 0.1, not the 0.25 of goal_som_lipvq_smooth. The smoothed target
# (1-2a, a, a) has a normalized entropy the policy cannot go below; at a=0.25
# that floor is exactly 0.500, which is also manager_actent_target, so the
# entropy controller had no headroom and its multiplier ran to ~1e4 times the
# healthy value (e479). a=0.1 puts the floor at 0.307 interior / 0.168 endpoint
# while still sharing a tenth of the credit with each neighbour.
goal_som_lipvq_line_smooth:
  agent:
    goal_ae_impl: vq
    goal_kl: False
    goal_struct_weight: 0.0
    goal_struct_adapt: False
    goal_soft_reuse_adapt: False
    goal_vq: {som: True, lip: True, topology: line, mgr_smooth: 0.1}

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

robot: &robot
  <<: *size1m
  task: robot_drive
  # Episode length is in steps, not seconds, so it tracks the phone's
  # CONTROL_HZ: 1000 steps is 20s at 50Hz and 100s at 10Hz.
  env.robot.length: 1000
  online_learning: True
  batch_size: 16
  batch_length: 32
  report_length: 32
  run:
    steps: 1e5
    envs: 1
    train_ratio: 512
    log_every: 30
    report_every: 300
    save_every: 300
    log_video: False
  replay: {size: 1e5}
  online_actor_replay_size: 100000
  online_sync_every: 30
  # No platform pin: embodied/jax/internal.py:resolve_platform already maps
  # the configured platform onto whatever this machine has, and pinning cpu
  # here would only bite on Linux while being ignored on macOS anyway.
  jax: {compute_dtype: float32, prealloc: False}
  logger: {outputs: [jsonl, scope]}

robot_daydreamer:
  <<: *robot
  task: robot_balance
  # Matched to the DayDreamer A1 quadruped, the closest published analogue:
  # high control rate, no resets, learned in about an hour. Their settings are
  # action repeat 50, train_every 4 and batch 32x32, giving 0.25 gradient steps
  # per agent step and an effective train_ratio of 256.
  #
  # train_ratio is spent per AGENT step, so repeat is what buys the ratio: at
  # 48Hz with repeat 4 the agent decides 12 times a second while this Mac
  # sustains ~6 gradient steps/s, which lands the achieved ratio near 256
  # instead of the ~64 measured at repeat 1. The phone keeps sensing at 48Hz
  # either way, so control authority is unaffected between decisions.
  env.robot.repeat: 4
  # 1000 underlying steps is 250 agent decisions, matching their env.length.
  env.robot.length: 1000
  # No terminations: the quadruped learned to roll over and stand up without
  # resets, which is the same answer as ours since the body cannot self-right
  # under proportional drive.
  env.robot.fall_angle: 0.0
  # Keep size1m's 3x64 MLPs and only shrink the RSSM. DayDreamer instead left
  # actor/critic/encoder/decoder at 4x512 and shrank just the RSSM, so our
  # policy is ~8x narrower than the one that learned to walk -- worth revisiting
  # if learning stalls for want of capacity rather than data.
  #
  # Measured on this Mac 2026-09-02, throughput against network shape, all at
  # repeat 4 and batch 16x32 unless noted (train_ratio counts SAMPLES per agent
  # step, so batch size matters as much as width):
  #
  #   shape                deter  samples/s  achieved ratio
  #   3x64  (size1m)         256       3011             336
  #   4x256                  256       1613             178
  #   4x512 (DayDreamer)     256       1193             134
  #   3x1024                 256        594              67
  #   size6m (batch 4x32)   1024        603              67
  #
  # Only 3x64 and 4x256 are on the Pareto frontier; size6m does plenty of
  # gradient steps but starves the ratio because batch_size 4 exists to fit
  # deter 1024. A real GPU would remove the trade-off entirely.
  agent:
    .*\.rssm: {deter: 256, hidden: 64, classes: 4}

robot_balance:
  <<: *robot
  task: robot_balance
  # The body is a genuine inverted pendulum: released by hand it runs to a
  # bumper rather than returning. So terminate at 8deg from upright, inside
  # the bumpers at roughly -10/+11deg, which synthesises "fell over" without
  # needing the robot to actually topple. The termination is what makes this
  # learnable: the critic gets to learn time-to-failure rather than only a
  # shaped tilt score.
  env.robot.fall_angle: 0.14
  env.robot.status_every: 25
  # Determined on hardware 2026-09-02: under a sustained forward command the
  # body was observed leaning backwards while tilt read +9.16deg, so positive
  # tilt is a backward lean. An inverted pendulum is caught by driving the base
  # toward the lean, so a positive error needs a negative wheel command.
  env.robot.recover_gain: -1.0

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
