defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  online_learning: False
  online_actor_cpu: True
  online_actor_flush_steps: 128
  online_actor_replay_size: 250000
  online_sync_every: 180
  online_replay_sync_interval: 5
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope, wandb]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    wandb_fps: 40
    report_wandb_fps: 5
    wandb_videos: False  # send only scalars/histograms/images to wandb, no video (storage quota)
    user: ''
    wandb_project: dreamerv3
    wandb_entity: vasilache
    wandb_mode: online

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1, image: True}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 1000
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    from_checkpoint_regex: '.*'
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    deterministic: False
    expect_devices: 0
    enable_policy: True
    precompile: True
    coordinator_address: ''
    profiler: False

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3, goal_autoencoder: 1.0, goal_duration_prior: 1.0, goal_soft_reuse: 1.0}
    # Three independent optimizers (Director-style): the world model + heads, the
    # goal autoencoder (VAE), and the actor-critic (manager + worker actors/critics).
    # All default to the same DreamerV3 settings; tune per-component lr/agc as needed.
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    goal_opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    goal_enc: {layers: 3, units: 1024, act: silu, norm: rms, output: onehot, outscale: 0.1, unimix: 0.0, winit: trunc_normal_in}
    goal_dec: {layers: 3, units: 1024, act: silu, norm: rms, output: mse, outscale: 0.1, winit: trunc_normal_in}
    # --- Lipschitz-constrained SOM-VAE goal autoencoder (see hrl/goal_ae.py) ---
    # ``director`` keeps the categorical + straight-through head above. ``vq``
    # swaps in the blockwise vector quantizer; the manager's (L, C) one-hot
    # action space is unchanged either way, only the decoder's input differs.
    # Use the named blocks goal_vq / goal_som / goal_lipvq / goal_som_lipvq
    # rather than setting these by hand.
    goal_ae_impl: director      # director | vq
    goal_vq:
      dim: 8                    # embedding dim per block; L*dim is the decoder input
      som: False                # circular neighborhood loss + second reconstruction
      lip: False                # row-wise weight normalization + Lipschitz penalty
      # How reconstruction error reaches the encoder. `on` everywhere: the
      # straight-through estimator of VQ-VAE. SOM-VAE replaces it with a second
      # reconstruction from z_e, and `auto` used to follow that on the SOM arms,
      # but measured here that leaves the encoder's output variance collapsing
      # during training (z_std 0.11 vs 1.20) and the codebook with it
      # (perplexity 2.7 vs 7.9 of 8, reconstruction 375 vs 12). The SOM arms
      # keep the second reconstruction in addition. `off` with som=False
      # reproduces the LipVQ-VAE released code, which collapses outright
      # (perplexity 1.00). See test_goal_ae.py TestLearning.
      # Quoted: unquoted on/off are YAML 1.1 booleans.
      ste: 'on'                 # 'on' | 'off' | 'auto' (= not som)
      agg: sum                  # reduction of the quadratic terms over (L, dim)
      temp: 1.0                 # softmax temperature for the soft code / entropy
      stddev: 0.05              # codebook init scale (official SOM-VAE value)
      include_self: False       # official SOM-VAE also pulls the winner
      # 'ring' wraps and has no boundary; 'line' is an open path whose end
      # entries have one neighbor, masked rather than replaced by a zero
      # vector. A line spans a wider range of code distances (ideal
      # adjacent/arbitrary ratio 0.333 at C=8, against a ring's 0.533).
      topology: ring            # ring | line
      codebook_scale: 1.0       # ||sg[z_e] - z_q||^2
      commit_scale: 1.0         # ||z_e - sg[z_q]||^2  (equal weights == the
                                # single alpha term in motivation.tex)
      som_scale: 0.9            # neighborhood term (official SOM-VAE beta)
      # L_Lipschitz weight. LipVQ-VAE's gamma=1e-6 goes with its `prod` form and
      # a single constrained layer; with the 8 layers here `prod` reaches ~6e10
      # and the penalty becomes 99.96% of the goal-AE loss. `logprod` is
      # monotone in the same quantity with a depth-independent gradient, and
      # 0.03 puts the term at roughly 10% of the reconstruction.
      lip_scale: 0.03
      lip_impl: logprod         # logprod | prod (paper / Liu et al.) | sum (motivation.tex)
      # Which networks the constraint applies to. motivation.tex says encoder AND
      # decoder; LipVQ-VAE constrains only the encoder. Default follows
      # motivation.tex: the decoder's bound is what makes a small code edit a
      # small GOAL edit, which is the property being tested.
      lip_apply: enc_dec        # enc | dec | enc_dec
      lip_out: True             # also constrain the final projection
      lip_per_row: True         # one bound per output unit (paper text + code)
      lip_cinit: -1.0           # <0: init the bound to the layer's own row sums
      lip_clamp: True           # never scale a compliant row UP (paper + code)
      # Require norm=none so the per-layer bounds compose into a bound on the
      # whole trunk rather than on its linear layers alone.
      strict_bound: True
      # 'default' = nets.COMPUTE_DTYPE (bfloat16). 'float32' runs only the goal
      # autoencoder trunks in f32, which is what makes norm=none trainable.
      dtype: default            # default | float32
      # Give the manager policy the codebook's geometry: its per-block logits
      # become -s*||v - e_c||^2 against the (stop-gradiented) codebook instead
      # of C free logits, so a REINFORCE update favouring an entry also favours
      # its ring neighbours. Only meaningful with som=True. See
      # hrl/goal_ae.py ManagerRingHead.
      mgr_ring: False
      # Logits are -scale * (d^2 / mean d^2), so scale is dimensionless. 5 puts
      # the policy near 0.6 normalized entropy at init, just above the 0.5 that
      # mgr_actent targets, so the entropy regularizer tightens rather than
      # fights from below. 1 would be a uniform policy.
      mgr_ring_scale_init: 5.0
      # Alternative to mgr_ring, and a cleaner single-factor change: instead of
      # reparameterizing the manager's logits, spread the sampled skill event
      # over its ring neighbours before the REINFORCE log-prob, so an advantage
      # credited to one entry is also credited at this weight to the adjacent
      # ones. 0.0 reproduces the standard estimator exactly, so the arm differs
      # from goal_som_lipvq in this one number. Only meaningful with som=True.
      mgr_smooth: 0.0
    # Trunks for the vq encoder/decoder. norm is `none` so the per-layer
    # Lipschitz bounds compose into a bound on the whole trunk (a rescaling
    # norm layer is not 1-Lipschitz and breaks the composition). An earlier
    # revision used `rms` after the unnormalized trunk produced non-finite
    # values within 2-16 train steps; that turned out to be specific to V100 --
    # the same configuration runs 1500 steps clean on A100, where the
    # experiments execute, and the goal autoencoder in isolation is clean on
    # both. See hrl/lipschitz.py LipMLP and goal_vq.dtype for the f32 fallback.
    goal_vq_enc: {layers: 3, units: 1024, act: silu, norm: none, outscale: 0.1, winit: trunc_normal_in}
    goal_vq_dec: {layers: 3, units: 1024, act: silu, norm: none, outscale: 0.1, winit: trunc_normal_in}
    # Director-style factorized codes: L categoricals × C classes (L×C logits, L×C one-hot).
    # Master HRL switch. When False, the agent collapses to the v4-online flat AC:
    # single ``pol``/``val`` over WM features, no manager/goal-VAE, no skill aggregation.
    use_hrl: True
    # Manager-policy input conditioning (masked goals only; all default off, so the
    # manager input stays exactly feat2tensor(feat)). Each appends a stop-gradient'd
    # channel built from the PRE-edit running code Z so the manager can see what it is
    # editing / whether the standing goal was already reached. See agent._mgr_input.
    mgr_cond_goalcode: False   # concat flattened pre-edit running code Z (L*C dims); auto-forced True below by goal_soft_reuse_adapt regardless of this default
    # Direct (REINFORCE-free) implicit sparsity (2026-07-16, F18 follow-up #2).
    # F18 found impl_sparsity_mode catastrophic because "kept" has no
    # differentiable representation under plain (direct) sampling -- the only
    # channel was a stop-gradiented reward penalty through REINFORCE.
    # goal_delta_mode fixes this by recombining the SAMPLE itself with the
    # past; this is a cheaper alternative that leaves sampling untouched
    # (mutually exclusive with goal_delta_mode) and instead adds an ordinary
    # loss on the OVERLAP between this decision's own softmax and the previous
    # decision's: sum_c p_t[c]*p_{t-1}[c] per block, averaged over blocks --
    # bounded in [0,1] by Cauchy-Schwarz (the probability an independent draw
    # from each distribution would land on the same class). No sampling, no
    # decoder pass; backprops straight into both steps' own logits through
    # their softmax (see agent._emit_manager's goal_soft_reuse_adapt branch).
    # Implies mgr_cond_goalcode (forced on in agent.py), with that channel
    # carrying the previous decision's SOFT distribution instead of the
    # one-hot (mirrors goal_delta_mode's own input-side change; see
    # _mgr_input). Dual-ascent Lagrange multiplier (inverse=True, "push up
    # when below target", same sense as goal_reuse_adapt) holds mean overlap
    # AT goal_soft_reuse_target rather than driving it to 1 unconditionally.
    # Default masking mechanism (2026-07-22): block-overlap reuse, ratcheted to
    # target 0.5, struct+ratchet -- the e286 (hopper BIG)/e290 (cheetah BIG) recipe,
    # the best-performing cell of the F19 retest (both above their Director
    # baseline late in training; see EXPERIMENTS.md §2/§3 F19 interim update and
    # paper/main.tex §softreuse). Pairs with goal_struct_adapt/_target below.
    goal_soft_reuse_adapt: True
    goal_soft_reuse_target: 0.5
    # Open-loop anneal of the target itself (agent.Ratchet, same mechanism as
    # impl_sparsity_target_sched / goal_reuse_target_sched): ramps from
    # goal_soft_reuse_target_init toward goal_soft_reuse_target by at most
    # goal_soft_reuse_target_vel per training call. Default init == target ->
    # no-op (constant target from step 0) unless explicitly ratcheted.
    goal_soft_reuse_target_init: 0.0
    # BIG-scale calibration (0->0.5 over ~2M env-steps at MGR_FREQ=8,
    # train_ratio=64); e286/e290 exact value. Small-scale runs should override
    # to ~1.0e-6 (project convention: BIG vel * small/BIG env-steps-per-call
    # ratio), matching GOAL_SOFT_REUSE_TARGET_VEL in the sbatch templates.
    goal_soft_reuse_target_vel: 3.9e-6
    goal_soft_reuse_adapt_init: 1.0
    goal_soft_reuse_adapt_min: 1e-5
    goal_soft_reuse_adapt_max: 100.0
    goal_soft_reuse_adapt_vel: 0.1
    goal_soft_reuse_adapt_one_sided: False
    skill_shape: [8, 8]
    skill_classes: 8
    goal_autoencoder_beta: 0.25
    # Geometry preservation: extra goal-AE term making code-space cosine_max
    # distances match deter-space distances (far->far, near->near, proportional),
    # so running-goal edits move the goal predictably. 0 = off. Folds into the
    # goal_autoencoder loss (no separate scale). See pairwise_cosmax / goal/struct_*.
    goal_struct_weight: 0.0
    # Log goal/struct_corr[_hard] (Pearson r between goal-space and goal-code
    # pairwise geometry, see agent.py's struct_diag block) every train step
    # even when the struct loss itself is off (goal_struct_weight=0, no
    # adapt) -- e.g. to track this property across training for pure-
    # Director baselines. See experiments/goal_code_struct_corr/. Off by
    # default (extra O((batch_size*batch_length)^2) work per train step).
    goal_struct_diag: False
    # Structural-correlation variants (all gated; defaults reproduce the original
    # fixed-weight deter/MSE behavior exactly). target: geometry source the code is
    # matched to -- ``deter`` (default) or ``feat`` (full deter+stoch tensor, the
    # richer target the worker actually conditions on). kind: ``mse`` (squared
    # Gram-matrix match) or ``margin`` (contrastive pull-positives / push-negatives
    # hinge that separates far-apart states' codes more aggressively, margin width
    # ``goal_struct_margin``). adapt: wrap the struct term in an AutoAdapt (dual-
    # ascent Lagrangian) that tunes the weight toward a ``goal/struct_loss``
    # setpoint instead of using the fixed weight -- grows while loss > target,
    # shrinks while loss < target, by default (two-sided, like the mask-rate and
    # duration controllers). goal_struct_adapt_one_sided=True switches to a
    # ratchet that still grows on violation but never shrinks back once the
    # target is cleared -- useful if the setpoint is observed to be re-violated
    # later in training (BIG-scale struct loss drifts back up under a fixed
    # weight) and premature relaxation is a concern; off by default.
    goal_struct_target: deter   # deter | feat
    goal_struct_loss: mse       # mse | margin
    goal_struct_margin: 0.1
    # e286/e290 default recipe (see goal_soft_reuse_adapt above): struct+ratchet
    # on top of the block-overlap reuse loss, target 0.01 (not the 0.005 general
    # struct-adapt setpoint -- this specific pairing was tuned as target 0.01).
    goal_struct_adapt: True
    goal_struct_adapt_target: 0.01
    goal_struct_adapt_one_sided: False
    goal_struct_adapt_min: 1.0
    goal_struct_adapt_max: 2000.0
    goal_struct_adapt_vel: 0.1
    goal_struct_adapt_init: 200.0
    # Goal reconstruction reduction over the ``deter`` dim. ``sum`` (DreamerV3/
    # Director default) sums squared error -> magnitude scales with ``deter`` and
    # shifts the rec:kl balance across model sizes. ``mean`` averages per-dim then
    # rescales by ``goal_rec_dim_ref`` (option 2): with ref = 1024 (6m deter) the
    # 6m run is numerically unchanged while smaller sizes are mapped onto the same
    # scale, removing the dimension-count term from cross-size comparisons.
    goal_rec_loss_agg: sum
    goal_rec_dim_ref: 1024
    # If false, KL term inside ``goal_autoencoder`` is zero (rec still trained).
    goal_kl: True
    # Director ``encdec_kl`` adaptive scale: holds KL(enc||uniform) near target nats.
    goal_kl_impl: mult
    goal_kl_target: 10.0
    goal_kl_min: 1e-5
    goal_kl_max: 1.0
    goal_kl_vel: 0.1
    goal_kl_init: 1.0
    manager_policy: {layers: 3, units: 1024, act: silu, norm: rms, output: onehot, outscale: 0.1, unimix: 0.0, winit: trunc_normal_in}
    manager_sample_freq: 8
    # Variable goal length (opt-in, HiPPO-style): the manager additionally emits a
    # discrete duration p in {goal_duration_min..goal_duration_max}; the emitted
    # goal is held for exactly p steps before the next manager decision (instead of
    # the fixed ``manager_sample_freq`` window). When True, manager training drops
    # the fixed-K downsampling and trains on the FULL-resolution rollout, masking
    # the REINFORCE policy loss to the per-step manager-decision (``switch``) steps;
    # the worker resets its goal-window lambda-return at the same switch boundaries.
    # False = fixed-K Director behavior (byte-for-byte unchanged). Pair with a larger
    # ``imag_length`` (e.g. 32) so several decisions fit per imagined rollout.
    variable_goal_length: False
    goal_duration_min: 1
    goal_duration_max: 16
    # HiTS-style timed subgoals (Guertler et al. 2021): append the normalized
    # countdown until the next manager decision (steps left incl. current, mapped
    # to [-1, 1] by the duration budget) to the worker policy AND value inputs.
    # Makes the worker's per-goal horizon observable — under variable_goal_length
    # the deadline is otherwise random and invisible to the worker. False = the
    # worker sees only (feat, goal), exactly as before.
    worker_timed_goals: False
    # Soft prior pulling the manager's expected goal duration toward a setpoint
    # (e.g. the fixed-K=8 regime that lifted worker reaching), independent of the
    # REINFORCE advantage. Adds ``goal_duration_reg * (E[duration] -
    # goal_duration_target)^2`` to the manager policy loss at each decision step.
    # 0 = off (advantage alone shapes the duration, as before).
    goal_duration_reg: 0.0
    goal_duration_target: 8.0
    # Mask-style Lagrangian alternative to BOTH ``goal_duration_reg`` (fixed) and
    # ``goal_duration_adapt`` (adapts a squared-error-magnitude proxy toward a
    # nonzero setpoint, so it never fully converges). This adapter regulates the
    # switch-weighted mean |E[duration] - goal_duration_target| against a small
    # tolerance (``goal_duration_lagrange_tol``): symmetric in deviation direction,
    # grows while the deviation exceeds the tolerance, self-relaxes once within it.
    # (The first version, e152-e159, regulated the RAW mean duration one-sidedly and
    # railed at max -- fixed 2026-07-10.) Folded OUT of ``mgr_policy`` into its own
    # loss key (``goal_duration_prior``, own ``loss_scales`` entry), matching how
    # ``mask_sparsity`` gets an independent scale -- unlike the fixed/``_adapt``
    # paths above, which share ``policy``'s scale. Mutually exclusive with
    # ``goal_duration_adapt`` (this takes priority if both are set).
    # 0/False = off (use the paths above).
    goal_duration_lagrange: False
    goal_duration_lagrange_tol: 0.1
    goal_duration_lagrange_impl: mult
    goal_duration_lagrange_min: 1e-5
    goal_duration_lagrange_max: 5.0
    goal_duration_lagrange_vel: 0.1
    goal_duration_lagrange_init: 1.0
    # Force a constant goal duration (in steps) through the variable-K machinery,
    # bypassing the duration head sample. >0 enables; used as a control (variable
    # training graph at a fixed K, no duration prior). 0 = use the emitted duration.
    goal_duration_fixed: 0
    # Optional per-decision cost subtracted from the manager extrinsic reward at each
    # switch step (discourages churning short goals, HiTS-style). 0 = advantage alone
    # shapes the duration.
    goal_switch_cost: 0.0
    # Manager extrinsic-reward block aggregation: 'mean' (per-step average, original)
    # or 'sum' (continuation-weighted SMDP option return). Under per-step block
    # discounting 'mean' under-credits long blocks (short-K bias); 'sum' is K-neutral.
    mgr_reward_agg: mean
    # Hindsight-relabel a block-pooled decision's duration class when the
    # imagination horizon cuts its hold short (rather than a real switch), so
    # REINFORCE credits the duration actually realized, not the sampled one.
    # Only meaningful under variable_goal_length (block pooling is always on
    # there). Default True
    # (the fix); ablate by setting False.
    goal_duration_relabel_truncated: True
    # How the manager POLICY term treats a hold cut short by the imagination
    # horizon: keep (historical; pairs with goal_duration_relabel_truncated) |
    # drop_duration (withhold only the duration head's log-prob there -- the
    # only action that provably did not execute; the critic target and the
    # skill advantage are valid n-step quantities either way) | drop_decision
    # (withhold the whole decision's policy credit). The critic is never gated.
    goal_duration_truncated_policy: keep
    worker_report_horizon: 32
    worker_split_traj: True
    mgr_expl_weight: 0.1
    manager_actent: 3e-4
    # Director ``actent`` adaptive scale on per-dim normalized manager entropy.
    manager_actent_impl: mult
    manager_actent_target: 0.5
    manager_actent_duration_target: -1.0  # <0 inherits manager_actent_target; raise (e.g. 0.8) to keep the variable-K duration head exploratory (anti short-K collapse)
    manager_actent_min: 1e-5
    manager_actent_max: 1e2
    manager_actent_vel: 0.1
    manager_actent_init: 1.0
    manager_actent_perdim: True
    manager_slowtar: False
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 16
    horizon: 333
    contdisc: True
    imag_loss:
      slowtar: False
      lam: 0.95
      actent: 3e-4
      slowreg: 1.0
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    # Manager and worker actor-critics both use these DreamerV3 defaults: the
    # ``perc`` retnorm scales the advantage by the 5-95 percentile return range,
    # ``valnorm: none`` trains the symexp_twohot critic on RAW returns (the head's
    # symlog transform handles scale), and ``advnorm: none`` leaves the advantage
    # at that perc scale. This is the proven flat-v3 normalization, applied
    # identically to every AC head so the default v3 hyperparameters transfer.
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    # Manager-only retnorm override. ``meanstd`` scales the manager advantage by
    # the running return std (Director's original ``retnorm: std``); the mean
    # offset it returns is unused by the manager advantage path (``roff_*`` is
    # discarded), so this is std-only scaling. Worker and flat heads keep the
    # ``perc`` retnorm above.
    mgr_retnorm: {impl: meanstd, rate: 0.01, limit: 1e-8, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False
    # Subset of HRL goal-proposal modes to render videos for. Director's original
    # list was ['manager','prior','replay']. Per-impl gating is via the bool
    # flag below — the list type just stays non-empty so elements.Config can
    # infer its element type.
    report_impl_videos: [manager]
    report_impl_videos_enabled: False
    # Limit number of replay rows visualised in report() videos (was hardcoded 6).
    report_max_rows: 4
    # Render the per-step vec-to-rgb summary of deter/skill tensors. These are
    # debug visualisations and dominate report() time on small models; default off.
    report_vec_viz: False
    # Render the goal-VAE-reconstruction panel from manager-proposed goals. Same
    # information as the openloop ``goal/recon`` panel just via a different goal
    # source; off by default to halve the goal/* video count.
    report_mgr_recon: False
    # Subsample report videos before W&B/TB encoding. ``time_stride: 8`` keeps
    # every 8th frame and roughly 8×s the per-video encode cost; combined with
    # the impl/mgr_recon/vec-viz trims and the bumped ``report_every`` it brings
    # overall GIF cost down ~10× relative to the original defaults.
    report_video_time_stride: 1
    report_video_space_stride: 1
    # 3-row skill viz [skill heatmap | deter heatmap | decoded goal image] and
    # 5-row goal encoder viz [og | enc_deter | enc_goal | dec_deter | dec_image].
    # Both appear under skill_viz/ and goal_enc_viz/ in WandB.
    report_skill_viz: True
    report_goal_enc_viz: True
    # Offline goal-code structure diagnostics (volatility + on-manifold splice test);
    # off by default, enabled only by the diag driver. See Agent._code_diag.
    report_code_diag: False
    # Decode goal image at every policy step and stack with obs for episode rollout.
    # Logged as epstats/policy_image_with_goal. Adds one decoder forward pass per step.
    policy_goal_image: True
    # Emit the current-state deter vector and its soft goal-code (goal_enc output)
    # at every policy step, under log/struct_diag_*. Off by default; used only by
    # experiments/goal_code_struct_corr/diag_goal_struct_corr.py to correlate
    # goal-space vs. goal-code geometry on a live rollout (no gradient/training
    # effect -- pure forward pass).
    policy_struct_diag: False

