<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Face</title>
<style>
/* The robot's face and, apart from it, the instruments behind it.
   Design and its reasons: docs/robot/FACE.md.

   The face (top, or left in landscape) is the robot as if alive: two eyes on
   an LED matrix, nothing else, no text. Its few degrees of freedom are
   deliberate, so it reads as a machine and stays out of the uncanny valley.
   The panel (below, or right) is the engineer's view: what the robot feels,
   its last 20 s, its body and its wheels.

   Data: live from the phone at /face (its /ws state's `emotion`), from a
   phone elsewhere with ?robot=host:port, or a recording with ?trace=URL or
   an embedded window.FACE_TRACE (tools/robot/face/trace_from_csv.py).
   ?view=face shows the face alone (double-tap the face to bring the panel
   back); ?grid= LED columns (44); ?fps= (30); ?dpr= (1.5); ?tau= (0.5 s). */
:root {
  --stage: #030507; --panel: #0f1318; --raised: #161b22; --line: #232b35;
  --ink: #dfe5ec; --dim: #8b96a3; --faint: #56616d;
  --val-pos: #eda100; --val-neg: #3987e5; --arousal: #d55181;
  --control: #199e70; --pain: #e66767; --reward: #9085e9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--stage); color: var(--ink);
  font: 13px/1.35 "IBM Plex Sans", system-ui, sans-serif; overflow: hidden; }
.app { display: grid; height: 100%; grid-template-rows: minmax(52%, 1fr) auto; }
#stage { position: relative; min-height: 0; background: var(--stage); }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#panel { background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  display: grid; gap: 10px; align-content: start; min-width: 0; overflow: hidden; }
.app.face-only #panel { display: none; }
@media (min-aspect-ratio: 1/1) {
  .app { grid-template-rows: 100%; grid-template-columns: minmax(0, 1fr) min(420px, 42vw); }
  #panel { border-top: 0; border-left: 1px solid var(--line); overflow-y: auto;
    padding: 14px 16px; gap: 14px; }
  .app.face-only { grid-template-columns: 1fr; }
}
/* Portrait on the robot: the cradle hides the bottom corners. */
@media (max-aspect-ratio: 10/13) {
  #panel { padding-bottom: max(52px, env(safe-area-inset-bottom, 0px)); }
}
.head { display: flex; align-items: center; gap: 10px; }
.head h1 { margin: 0; white-space: nowrap; font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); }
.head .sp { flex: 1; }
#src { font: 11px "IBM Plex Mono", ui-monospace, monospace; color: var(--faint); }
#src.on { color: var(--dim); }
.head button { white-space: nowrap; font: 12px "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.head button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
.reading { font: 600 12px "IBM Plex Sans", system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--ink); margin-left: 6px; }
.reading small { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 4px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
.mod { min-width: 0; }
.mod h2 { margin: 0 0 4px; white-space: nowrap; overflow: hidden; font: 500 10px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em;
  text-transform: uppercase; color: var(--faint); }
canvas.inst { display: block; width: 100%; }
#cmap { aspect-ratio: 1 / 1; max-height: 140px; }
#gauges { width: 84px; height: 140px; }
#body { height: 140px; }
#strip { height: 132px; }
@media (max-aspect-ratio: 10/13) { #panel { gap: 8px; padding-top: 8px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div id="stage"><canvas id="face" role="img" aria-label="The robot's face"></canvas></div>
  <section id="panel" aria-label="Instruments: what the robot feels and does">
    <div class="head">
      <h1>Behind the face</h1><span class="sp"></span>
      <span id="src">connecting…</span>
      <button id="sound" type="button" aria-label="Sound">♪ off</button>
      <button id="hide" type="button" title="Face only (double-tap the face to come back)">Face only</button>
    </div>
    <div class="row">
      <div class="mod"><h2>Feeling <span class="reading" id="reading" aria-live="polite"></span></h2><canvas class="inst" id="cmap" aria-label="Valence (sad to glad) against arousal (calm to aroused), with the last 10 s"></canvas></div>
      <div class="mod"><h2>&nbsp;</h2><canvas class="inst" id="gauges" aria-label="Control (empowerment) and pain"></canvas></div>
      <div class="mod"><h2>Body</h2><canvas class="inst" id="body" aria-label="Tilt, bumpers and wheel commands"></canvas></div>
    </div>
    <div class="mod"><h2>Last 20 s</h2><canvas class="inst" id="strip" aria-label="Valence, arousal, control, pain and reward over the last 20 seconds"></canvas></div>
  </section>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => { const x = parseFloat(q.get(k)); return isFinite(x) ? x : d; };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { pos: css('--val-pos'), neg: css('--val-neg'), arousal: css('--arousal'), control: css('--control'),
    pain: css('--pain'), reward: css('--reward'), ink: css('--ink'), dim: css('--dim'), faint: css('--faint'),
    line: css('--line'), raised: css('--raised'), panel: css('--panel') };
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const app = document.getElementById('app');
  if (q.get('view') === 'face') app.classList.add('face-only');
  document.getElementById('hide').onclick = () => { app.classList.add('face-only'); };
  document.getElementById('stage').addEventListener('dblclick', () => app.classList.toggle('face-only'));

  // ---- state ---------------------------------------------------------------
  // `target` is the latest message; `mid` follows it through a 0.05 s average
  // (the phone's values jitter sample to sample); the face's features then
  // follow `mid` through springs, the instruments show `mid` as it is.
  const AFFECT = ['valence', 'arousal', 'dominance', 'pain', 'td_valence'];
  const BODY = ['reward', 'tilt', 'act_l', 'act_r', 'chosen_l', 'chosen_r'];
  const target = { valence: 0, arousal: 0.4, dominance: 0, pain: 0, td_valence: 0 };
  const mid = { ...target };
  const has = {};   // which optional signals this source sends
  let bumpers = null, zone = 0.035, lastMsg = 0;
  function setState(e) {
    if (!e) return;
    lastMsg = performance.now();
    for (const k of AFFECT.concat(BODY))
      if (typeof e[k] === 'number' && isFinite(e[k])) { target[k] = e[k]; has[k] = true; if (!(k in mid)) mid[k] = e[k]; }
    if (typeof e.bumper_back === 'number') bumpers = [e.bumper_back, e.bumper_front];
    if (typeof e.pain_zone === 'number') zone = e.pain_zone;
  }
  window.__faceSet = setState;   // for trying states from devtools
  const src = document.getElementById('src');
  function playTrace(tr) {
    src.textContent = '▶ recording'; src.className = 'on';
    const start = performance.now(), T = tr.t[tr.t.length - 1] || 1;
    (function tick() {
      const s = ((performance.now() - start) / 1000) % T;
      const i = Math.min(tr.t.length - 1, Math.floor(s * (tr.hz || 10))), e = {};
      for (const k of AFFECT.concat(BODY)) if (tr[k]) e[k] = tr[k][i];
      for (const k of ['bumper_back', 'bumper_front', 'pain_zone']) if (k in tr) e[k] = tr[k];
      setState(e); setTimeout(tick, 1000 / (tr.hz || 10));
    })();
  }
  if (window.FACE_TRACE) playTrace(window.FACE_TRACE);
  else if (q.get('trace')) fetch(q.get('trace')).then(r => r.json()).then(playTrace)
    .catch(() => { src.textContent = 'trace not found'; });
  else (function connect() {
    try {
      const host = q.get('robot') || location.host;
      const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + host + '/ws');
      ws.onopen = () => { src.textContent = '● live'; src.className = 'on'; };
      ws.onmessage = m => { try { setState(JSON.parse(m.data).emotion); } catch (e) {} };
      ws.onclose = () => { src.textContent = 'no robot'; src.className = ''; setTimeout(connect, 3000); };
    } catch (e) { src.textContent = 'no robot'; }
  })();

  // ---- sound: a soft chirp, pitch with arousal, rising when glad ------------
  let audio = null, soundOn = false, lastChirpV = 0;
  const btn = document.getElementById('sound');
  btn.onclick = () => {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { btn.textContent = 'No sound'; return; } }
    soundOn = !soundOn; if (audio.state === 'suspended') audio.resume();
    btn.textContent = soundOn ? '♪ on' : '♪ off';
    if (soundOn) chirp(mid.valence, mid.arousal, 0);
  };
  function chirp(v, a, p) {
    if (!audio || !soundOn) return;
    const base = 260 + 420 * a, step = p > 0.3 ? 0.7 : v >= 0 ? 1.26 : 0.84;
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = p > 0.3 ? 'square' : v >= 0 ? 'sine' : 'triangle';
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * step, t + 0.1 + 0.2 * (1 - a));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(p > 0.3 ? 0.05 : 0.1, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.4);
  }

  // ---- springs ---------------------------------------------------------------
  // Critically damped, one per feature: a sudden signal still moves the face
  // smoothly. kick() adds velocity for phasic events (a startle, a bounce).
  const springs = {};
  function spring(name, goal, dt, omega = 10) {
    const s = springs[name] || (springs[name] = { x: goal, v: 0 });
    for (let n = Math.ceil(dt / 0.008), h = dt / n; n > 0; n--) {
      s.v += (omega * omega * (goal - s.x) - 2 * omega * s.v) * h; s.x += s.v * h;
    }
    return s.x;
  }
  const kick = (name, dv) => { if (springs[name]) springs[name].v += dv; };

  // ---- the face: two eyes on an LED matrix ---------------------------------
  const cv = document.getElementById('face'), ctx = cv.getContext('2d');
  const COLS = Math.round(clamp(num('grid', 44), 16, 80));
  const DPR = Math.min(window.devicePixelRatio || 1, num('dpr', 1.5));
  let W = 0, H = 0, cell = 1, rows = 1, cols = COLS, ox = 0, oy = 0, unlit = null, buf, bctx, img, glow, gctx;
  function layoutFace() {
    const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    // Square LEDs; the matrix spans the short side's worth of COLS and the
    // long side as far as it goes.
    cell = Math.min(W, H * 1.25) / COLS;
    cols = Math.floor(W / cell); rows = Math.floor(H / cell);
    ox = (W - cols * cell) / 2 + cell / 2; oy = (H - rows * cell) / 2 + cell / 2;
    unlit = document.createElement('canvas'); unlit.width = cv.width; unlit.height = cv.height;
    const u = unlit.getContext('2d'); u.setTransform(DPR, 0, 0, DPR, 0, 0);
    u.fillStyle = '#0c1117'; u.beginPath();
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      u.moveTo(ox + i * cell + cell * 0.36, oy + j * cell); u.arc(ox + i * cell, oy + j * cell, cell * 0.36, 0, 2 * Math.PI);
    }
    u.fill();
    buf = document.createElement('canvas'); buf.width = cols; buf.height = rows;
    bctx = buf.getContext('2d'); img = bctx.createImageData(cols, rows);
    glow = document.createElement('canvas'); glow.width = (cols + 2) * 4; glow.height = (rows + 2) * 4;
    gctx = glow.getContext('2d');
  }

  // One eye's shape, in LED units: a rounded rectangle cut by an upper lid
  // (a line, tilted: inner end down = cross or hurt, outer end down = sad) and
  // a lower lid (an arch rising in the middle: the smiling squint). u is the
  // distance toward the nose.
  function inside(x, y, e, s) {
    const dx0 = x - e.cx, dy = y - e.cy, u = -s * dx0;
    const ax = Math.abs(dx0) - (e.hw - e.r), ay = Math.abs(dy) - (e.hh - e.r);
    if (ax > e.r || ay > e.r) return false;
    if (ax > 0 && ay > 0 && ax * ax + ay * ay > e.r * e.r) return false;
    if (dy < -e.hh + e.top * 2 * e.hh + e.tilt * u) return false;
    const k = u / e.hw;
    if (dy > e.hh - e.bot * 2 * e.hh * Math.max(0, 1 - k * k) - e.btilt * u) return false;
    return true;
  }

  // Pain's eye: squeezed shut into a chevron, its point toward the nose
  // (> <), a stroke ~1.5 LEDs thick. Not a slanted lid: that is anger.
  function chevron(x, y, e, s) {
    const u = -s * (x - e.cx), dy = Math.abs(y - e.cy);
    const vx = e.hw * 0.55, ex = -e.hw * 0.75, ey = e.ch;   // vertex (vx, 0), arm end (ex, ey)
    const dx = ex - vx, L2 = dx * dx + ey * ey;
    const t = clamp(((u - vx) * dx + dy * ey) / L2, 0, 1);
    const px = vx + t * dx - u, py = t * ey - dy;
    return px * px + py * py <= 0.75 * 0.75;
  }

  let halfAt = -1e9, phase = 0, blinkAt = 0, blinkT = 1, sacAt = 0, gaze = [0, 0], prevA = 0.4, prevTd = 0, prevPain = 0, flash = 0;
  function drawFace(dt, ms) {
    const v = clamp(mid.valence, -1, 1), a = clamp(mid.arousal, 0, 1), d = clamp(mid.dominance, -1, 1);
    const p = clamp(mid.pain, 0, 1), td = clamp(mid.td_valence || 0, -1, 1);
    const sp = (n, g, w) => spring(n, g, dt, w);

    // Phasic events, on top of the tonic state: a startle when arousal jumps,
    // a bounce and a flash for a good surprise in value, a flinch for a bad one
    // or a sudden hurt.
    const da = (a - prevA) / Math.max(dt, 1e-3); prevA = a;
    if (da > 1.5) kick('wide', 4 * Math.min(1, da / 4));
    if (td - prevTd > 0.35 && td > 0.3) { kick('bounce', 3); flash = Math.max(flash, 0.6); }
    if ((prevTd - td > 0.35 && td < -0.3) || p - prevPain > 0.3) blinkT = Math.min(blinkT, 0.05);
    prevTd = td; prevPain = p;
    flash *= Math.exp(-dt / 0.25);

    // Blinks: ~every 2-6 s, rarer when aroused, 0.2 s each.
    if (ms > blinkAt) { blinkT = 0; blinkAt = ms + 2500 + Math.random() * (2000 + 5000 * (1 - a)); }
    blinkT = Math.min(1, blinkT + dt / 0.2);
    const blink = Math.sin(Math.PI * blinkT) ** 2;

    // Saccades: quick darts to a new spot, often when aroused; in control
    // the gaze holds steady and level, helpless it slides down and away.
    if (ms > sacAt) {
      const steady = clamp(0.5 + 0.5 * d, 0, 1);
      gaze = [(Math.random() * 2 - 1) * (0.35 + 0.9 * (1 - steady)), (Math.random() * 2 - 1) * 0.35 + 0.6 * Math.max(0, -d)];
      if (Math.random() < 0.4 * steady) gaze = [0, 0];   // back to looking at you
      kick('wide', -1.5);   // a dart carries a small squash (Vector's animators)
      sacAt = ms + (350 + Math.random() * 900) * (0.6 + 2.4 * (1 - a)) * (0.7 + 0.6 * steady);
    }
    const gx = sp('gx', gaze[0], 28), gy = sp('gy', gaze[1], 28);

    // Tonic layer (docs/robot/FACE.md has the reasons). Valence is the
    // eyes' shape: the upper lid's slope and height for unhappy (the brow,
    // corrugator), the smiling lower lid for glad (AU6, cheek raise).
    // Arousal is aperture, size and brightness. Dominance is posture and
    // gaze: in control the eyes sit higher, wider apart, steady, lids level
    // and a touch low; helpless lower, closer, inner corners raised
    // (worried), gaze down and away, half-blinks. Pain overrides arousal on
    // aperture: a squeeze toward > <, a shake, red.
    phase += dt * (0.8 + 2.2 * a);
    const vn = Math.max(0, -v), dp = Math.max(0, d);
    const scale = sp('scale', 1 + 0.08 * d + 0.1 * (a - 0.5)) * (1 + 0.06 * sp('bounce', 0, 9));
    const rise = sp('rise', -d * 1.6 + 0.8 * Math.max(0, -v), 4) + Math.sin(phase) * 0.25;
    const shake = sp('shake', 1.0 * p + Math.max(0, a - 0.85) * 2) * Math.sin(ms * 0.06);
    const open = sp('open', (0.62 + 0.5 * a) * (1 - 0.55 * p)) * (1 + 0.25 * clamp(sp('wide', 0, 12), -1, 2));
    if (d < -0.3 && Math.random() < dt * 0.25 * -d) halfAt = ms;   // a half-blink, anxious
    const half = Math.max(0, 1 - (ms - halfAt) / 450);
    const top = sp('top', 0.3 * clamp((0.45 - a) / 0.45, 0, 1) + 0.1 * Math.max(0, d) + 0.15 * Math.max(0, -v)
      + 0.25 * vn * (1 - dp) * (1 - a) + 0.3 * vn * dp * a + 0.2 * p) + 0.35 * Math.sin(Math.PI * half);
    // The slope: sad droops the outer ends; negative valence while in
    // control and aroused tips it inward instead (cross, not scared: anger
    // and fear differ mainly in dominance).
    const tilt = sp('tilt', vn * (-0.5 * (1 - dp) * (1 - 0.4 * a) + 1.0 * dp * a) - 0.15 * Math.max(0, -d));
    // glad: the smiling lower lid; scared: a tense one (Cozmo's fear)
    const bot = sp('bot', 0.5 * Math.max(0, v) * (1 - p) + 0.25 * vn * a * (1 - dp) + 0.2 * p);
    const btilt = 0;
    const squeeze = clamp(sp('squeeze', clamp((p - 0.35) / 0.4, 0, 1), 14), 0, 1);
    const round = sp('round', 0.5 + 0.45 * Math.max(0, v) - 0.25 * p);

    // Colour: one hue, cyan, its saturation and brightness rising with
    // arousal (Vector: a washed-out face when bored); red is pain's alone.
    const sat = sp('sat', 30 + 60 * a), light = (0.5 + 0.5 * sp('bright', 0.3 + 0.7 * a)) * (1 + flash)
      * (1 + 0.04 * (Math.random() - 0.5) * (0.5 + a));   // a slight shimmer
    let [R, G, B] = hsl(188, sat, 60);
    const pr = sp('pr', p);
    R = lerp(R, 255, pr * 0.85); G = lerp(G, 72, pr * 0.85); B = lerp(B, 60, pr * 0.85);

    // Geometry, in LED units, centred on the matrix. A blink squashes the
    // eye to a line that widens (Vector's), it is not a lid.
    const S = Math.min(cols, rows * 1.1) / 30 * scale;
    const cx0 = (cols - 1) / 2 + gx * 2.2 + shake, cy0 = (rows - 1) / 2 + rise + gy * 1.6;
    const hw = 4.4 * S * (1 + 0.25 * blink), hh = 5.2 * S * open * (1 - 0.92 * blink);
    const gap = sp('gap', 6.6 + 0.5 * d, 4) * S;
    const eyes = [-1, 1].map(s => ({
      s, cx: cx0 + s * gap - gx * 0.35 * S * s, cy: cy0 + blink * 1.5 * S,
      hw: hw * (1 - 0.06 * gx * s) * (1 - 0.05 * gy), hh: Math.max(0.35, hh), r: Math.min(hw, Math.max(0.35, hh)) * round,
      top, tilt, bot, btilt, ch: 3.2 * S }));
    // The gaze hotspot: brighter where the eyes look (no pupils, as Cozmo).
    const hx = cx0 + gx * 2.5, hy = cy0 + gy * 2.5 - 1.5 * S;

    // Brightness of each LED: the share of its 3x3 samples inside an eye.
    const data = img.data; data.fill(0);
    const off = [-1 / 3, 0, 1 / 3];
    for (const e of eyes) {
      const i0 = Math.max(0, Math.floor(e.cx - e.hw - 1)), i1 = Math.min(cols - 1, Math.ceil(e.cx + e.hw + 1));
      const j0 = Math.max(0, Math.floor(e.cy - e.hh - 1)), j1 = Math.min(rows - 1, Math.ceil(e.cy + e.hh + 1));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        let n = 0;
        for (const oxs of off) for (const oys of off) {
          const x = i + oxs, y = j + oys;
          if (squeeze < 1 && inside(x, y, e, e.s)) n += 1 - squeeze;
          if (squeeze > 0 && chevron(x, y, e, e.s)) n += squeeze;
        }
        if (n < 0.05) continue;
        const hs = 0.8 + 0.35 * Math.exp(-((i - e.cx - (hx - cx0)) ** 2 + (j - hy) ** 2) / (12 * S * S));
        const k = (j * cols + i) * 4, w = Math.min(1, n / 9 * light * hs);
        data[k] = Math.max(data[k], R * w); data[k + 1] = Math.max(data[k + 1], G * w);
        data[k + 2] = Math.max(data[k + 2], B * w); data[k + 3] = 255;
      }
    }
    bctx.putImageData(img, 0, 0);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#030507'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(unlit, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Glow: the LED image, upscaled smoothly, under the dots.
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true; ctx.globalAlpha = 0.7;
    // blurred at 4 px per LED (cheap), then upscaled smoothly
    gctx.clearRect(0, 0, glow.width, glow.height);
    if ('filter' in gctx) gctx.filter = 'blur(3px)';
    gctx.drawImage(buf, 4, 4, cols * 4, rows * 4);
    if ('filter' in gctx) gctx.filter = 'none';
    ctx.drawImage(glow, ox - cell / 2 - cell, oy - cell / 2 - cell, (cols + 2) * cell, (rows + 2) * cell);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // The LEDs, batched by brightness.
    const LV = 8, paths = Array.from({ length: LV }, () => new Path2D()), cols8 = new Array(LV);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = (j * cols + i) * 4, m = Math.max(data[k], data[k + 1], data[k + 2]);
      if (m < 6) continue;
      const lv = Math.min(LV - 1, Math.floor(m / 256 * LV));
      const x = ox + i * cell, y = oy + j * cell;
      paths[lv].moveTo(x + cell * 0.4, y); paths[lv].arc(x, y, cell * 0.4, 0, 2 * Math.PI);
    }
    for (let lv = 0; lv < LV; lv++) {
      const w = (lv + 1) / LV;
      ctx.fillStyle = `rgb(${Math.min(255, R * w + 30 * w * w)},${Math.min(255, G * w + 30 * w * w)},${Math.min(255, B * w + 30 * w * w)})`;
      ctx.fill(paths[lv]);
    }
    window.__face = { mid, target, eyes, springs, frames: (window.__face?.frames || 0) + 1, ms: performance.now() - ms };
  }
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [255 * f(0), 255 * f(8), 255 * f(4)];
  }

  // ---- instruments ----------------------------------------------------------
  const HZ = 10, SPAN = 20;
  const hist = []; let histT = 0;
  function sizeCanvas(c) {
    const r = c.getBoundingClientRect(), k = Math.min(window.devicePixelRatio || 1, 2);
    if (c.width !== Math.round(r.width * k) || c.height !== Math.round(r.height * k)) {
      c.width = Math.round(r.width * k); c.height = Math.round(r.height * k);
    }
    const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0);
    return [g, r.width, r.height];
  }
  const valColor = v => v >= 0 ? C.pos : C.neg;
  function text(g, s, x, y, color, align = 'left', base = 'middle', size = 10) {
    g.fillStyle = color; g.font = `${size}px ${MONO}`; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y);
  }

  // Valence across, arousal up: Russell's circumplex, the last 10 s as a trail.
  function drawMap() {
    const [g, w, h] = sizeCanvas(document.getElementById('cmap'));
    const s = Math.min(w, h), x0 = (w - s) / 2, pad = 4, L = s - 2 * pad;
    g.clearRect(0, 0, w, h);
    const X = v => x0 + pad + (v + 1) / 2 * L, Y = a => pad + (1 - a) * L;
    g.fillStyle = C.raised; g.beginPath(); g.roundRect(x0 + pad, pad, L, L, 6); g.fill();
    g.strokeStyle = C.line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(0), Y(1)); g.moveTo(X(-1), Y(0.5)); g.lineTo(X(1), Y(0.5)); g.stroke();
    text(g, 'excited', X(0.95), Y(0.95), C.faint, 'right', 'top', 9);
    text(g, 'tense', X(-0.95), Y(0.95), C.faint, 'left', 'top', 9);
    text(g, 'content', X(0.95), Y(0.05), C.faint, 'right', 'bottom', 9);
    text(g, 'low', X(-0.95), Y(0.05), C.faint, 'left', 'bottom', 9);
    const n = Math.min(hist.length, 10 * HZ);
    for (let i = hist.length - n; i < hist.length; i++) {
      const e = hist[i], k = (i - (hist.length - n)) / n;
      g.globalAlpha = 0.08 + 0.45 * k; g.fillStyle = valColor(e.valence);
      g.beginPath(); g.arc(X(e.valence), Y(e.arousal), 2, 0, 2 * Math.PI); g.fill();
    }
    g.globalAlpha = 1;
    const v = clamp(mid.valence, -1, 1), a = clamp(mid.arousal, 0, 1);
    g.fillStyle = valColor(v); g.strokeStyle = C.panel; g.lineWidth = 2;
    g.beginPath(); g.arc(X(v), Y(a), 5.5, 0, 2 * Math.PI); g.fill(); g.stroke();
  }

  // Control (dominance: empowerment) bipolar, pain 0..1.
  function drawGauges() {
    const [g, w, h] = sizeCanvas(document.getElementById('gauges'));
    g.clearRect(0, 0, w, h);
    const top = 14, bot = h - 16, bw = 10;
    const col = (x, label, val, lo, hi, color, bipolar) => {
      g.fillStyle = C.raised; g.beginPath(); g.roundRect(x - bw / 2, top, bw, bot - top, 4); g.fill();
      const Y = t => bot - (t - lo) / (hi - lo) * (bot - top);
      const y0 = bipolar ? Y(0) : bot, y1 = Y(clamp(val, lo, hi));
      g.fillStyle = color; g.beginPath();
      g.roundRect(x - bw / 2, Math.min(y0, y1), bw, Math.max(1.5, Math.abs(y1 - y0)), 3); g.fill();
      if (bipolar) { g.fillStyle = C.dim; g.fillRect(x - bw / 2 - 3, Y(0) - 0.5, bw + 6, 1); }
      text(g, label, x, h - 6, C.dim, 'center', 'middle', 10);
      text(g, (val >= 0 && bipolar ? '+' : '') + val.toFixed(2), x, 6, C.ink, 'center', 'middle', 10);
    };
    col(w * 0.27, 'control', clamp(mid.dominance, -1, 1), -1, 1, C.control, true);
    col(w * 0.73, 'pain', clamp(mid.pain, 0, 1), 0, 1, C.pain, false);
  }

  // The body from the side: the pendulum over its wheel, the bumpers and
  // the zone before them that hurts; tilt drawn x4 so a few degrees show.
  // Below: each wheel's command, applied (bar) and the policy's (tick).
  const TILT_X = 4;
  function drawBody() {
    const [g, w, h] = sizeCanvas(document.getElementById('body'));
    g.clearRect(0, 0, w, h);
    const bars = 34, gh = h - bars, cx = w / 2, wy = gh - 12, Lb = Math.min(gh - 26, w * 0.75);
    const ang = t => -Math.PI / 2 + t * TILT_X;   // tilt>0 leans front (right)
    const tip = (t, r) => [cx + Math.cos(ang(t)) * r, wy + Math.sin(ang(t)) * r];
    const bmp = bumpers || [-0.087, 0.113];
    // pain zones
    g.lineWidth = 6; g.lineCap = 'butt'; g.strokeStyle = 'rgba(230,103,103,0.25)';
    for (const [a0, a1] of [[bmp[0], bmp[0] + zone], [bmp[1] - zone, bmp[1]]]) {
      g.beginPath(); g.arc(cx, wy, Lb + 4, ang(a0), ang(a1)); g.stroke();
    }
    // bumpers
    g.strokeStyle = C.dim; g.lineWidth = 2; g.lineCap = 'round';
    for (const b of bmp) { const p0 = tip(b, Lb - 6), p1 = tip(b, Lb + 10); g.beginPath(); g.moveTo(...p0); g.lineTo(...p1); g.stroke(); }
    // upright reference
    g.setLineDash([2, 3]); g.strokeStyle = C.line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx, wy); g.lineTo(cx, wy - Lb - 8); g.stroke(); g.setLineDash([]);
    // floor and wheel
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(cx - w * 0.4, wy + 9); g.lineTo(cx + w * 0.4, wy + 9); g.stroke();
    const t = has.tilt ? mid.tilt : 0, p = clamp(mid.pain, 0, 1);
    g.fillStyle = C.raised; g.strokeStyle = C.dim; g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, wy, 9, 0, 2 * Math.PI); g.fill(); g.stroke();
    // the body
    const e = tip(t, Lb);
    g.strokeStyle = p > 0.05 ? `rgb(${lerp(200, 230, p)},${lerp(208, 103, p)},${lerp(216, 103, p)})` : C.ink;
    g.lineWidth = 6; g.beginPath(); g.moveTo(cx, wy); g.lineTo(...e); g.stroke();
    text(g, has.tilt ? `${(t * 180 / Math.PI).toFixed(1)}°` : 'tilt —', w - 2, 8, C.dim, 'right', 'middle', 10);
    text(g, `×${TILT_X}`, 2, 8, C.faint, 'left', 'middle', 9);
    text(g, 'back', 2, wy + 2, C.faint, 'left', 'middle', 9); text(g, 'front', w - 2, wy + 2, C.faint, 'right', 'middle', 9);
    // wheel commands
    const bx = 18, bw2 = w - bx - 4, mx = bx + bw2 / 2;
    [['L', 'act_l', 'chosen_l'], ['R', 'act_r', 'chosen_r']].forEach(([lab, ka, kc], i) => {
      const y = gh + 6 + i * 14;
      text(g, lab, 2, y + 3, C.dim, 'left', 'middle', 10);
      g.fillStyle = C.raised; g.fillRect(bx, y, bw2, 7);
      g.fillStyle = C.dim; g.fillRect(mx - 0.5, y - 2, 1, 11);
      if (has[ka]) {
        const v = clamp(mid[ka], -1, 1);
        g.fillStyle = C.ink; g.globalAlpha = 0.75;
        g.fillRect(v >= 0 ? mx : mx + v * bw2 / 2, y + 1, Math.abs(v) * bw2 / 2, 5); g.globalAlpha = 1;
      }
      if (has[kc]) { const c = clamp(mid[kc], -1, 1); g.fillStyle = C.pos; g.fillRect(mx + c * bw2 / 2 - 1, y - 2, 2, 11); }
    });
  }

  // Five lanes over the last 20 s, one scale each, shared time.
  function drawStrip() {
    const [g, w, h] = sizeCanvas(document.getElementById('strip'));
    g.clearRect(0, 0, w, h);
    const lanes = [
      ['valence', -1, 1, null, 'feeling'], ['arousal', 0, 1, C.arousal, 'arousal'],
      ['dominance', -1, 1, C.control, 'control'], ['pain', 0, 1, C.pain, 'pain'],
      // reward when the source sends it, else the TD error, else an empty lane
      [has.reward || !has.td_valence ? 'reward' : 'td_valence', null, null, C.reward,
        has.reward || !has.td_valence ? 'reward' : 'TD error'],
    ];
    const lab = 58, vw = 40, x0 = lab, x1 = w - vw, lh = (h - 12) / lanes.length;
    const X = i => x1 - (hist.length - 1 - i) / (SPAN * HZ - 1) * (x1 - x0);
    lanes.forEach(([k, lo, hi, color, name], li) => {
      const yt = li * lh + 2, yb = yt + lh - 5;
      let a = lo, b = hi;
      if (a === null) {   // auto range around zero
        let m = 1e-3; for (const e of hist) m = Math.max(m, Math.abs(e[k] || 0)); a = -m; b = m;
      }
      const Y = x => yb - (clamp(x, a, b) - a) / (b - a) * (yb - yt);
      const z = a < 0 ? Y(0) : yb;
      g.fillStyle = C.raised; g.fillRect(x0, yt, x1 - x0, yb - yt);
      g.fillStyle = C.line; g.fillRect(x0, z - 0.5, x1 - x0, 1);
      if (hist.length > 1) {
        // area to the baseline, then the 2px line; valence split by sign
        for (const sgn of color ? [0] : [1, -1]) {
          g.beginPath(); g.moveTo(X(0), z);
          hist.forEach((e, i) => { let x = e[k] || 0; if (sgn) x = sgn > 0 ? Math.max(0, x) : Math.min(0, x); g.lineTo(X(i), Y(x)); });
          g.lineTo(X(hist.length - 1), z); g.closePath();
          g.fillStyle = color || (sgn > 0 ? C.pos : C.neg); g.globalAlpha = 0.28; g.fill(); g.globalAlpha = 1;
        }
        g.beginPath(); hist.forEach((e, i) => { const y = Y(e[k] || 0); i ? g.lineTo(X(i), y) : g.moveTo(X(i), y); });
        g.strokeStyle = color || C.ink; g.lineWidth = 1.5; g.globalAlpha = color ? 1 : 0.7; g.stroke(); g.globalAlpha = 1;
      }
      text(g, name, 0, (yt + yb) / 2, C.dim, 'left', 'middle', 10);
      const cur = mid[k];
      text(g, cur === undefined || !has[k] && k !== 'valence' && k !== 'arousal' && k !== 'dominance' && k !== 'pain' ? '—' : (cur >= 0 && a < 0 ? '+' : '') + cur.toFixed(2),
        w, (yt + yb) / 2, C.ink, 'right', 'middle', 10);
    });
    text(g, '−20 s', x0, h - 4, C.faint, 'left', 'middle', 9);
    text(g, 'now', x1, h - 4, C.faint, 'right', 'middle', 9);
  }

  // One line in words: the quadrant, then control and pain when they stand out.
  const reading = document.getElementById('reading');
  function words() {
    const v = mid.valence, a = mid.arousal, d = mid.dominance, p = mid.pain;
    let w = v > 0.2 ? (a > 0.6 ? 'excited' : a < 0.4 ? 'content' : 'glad')
      : v < -0.2 ? (a > 0.6 ? 'distressed' : a < 0.4 ? 'low' : 'unhappy')
      : a > 0.65 ? 'alert' : a < 0.35 ? 'calm' : 'neutral';
    const extra = [];
    if (d > 0.4) extra.push('in control'); else if (d < -0.4) extra.push('helpless');
    if (p > 0.3) extra.push('hurting');
    return [w, extra.join(' · ')];
  }

  // ---- main loop ------------------------------------------------------------
  const FPS = Math.max(5, num('fps', 30)), TAU = Math.max(0.05, num('tau', 0.5));
  let t0 = performance.now(), instT = 0, lastWords = '';
  function frame(ms) {
    if (ms - t0 < 1000 / FPS - 2) { requestAnimationFrame(frame); return; }
    const dt = Math.min(0.1, (ms - t0) / 1000); t0 = ms;
    // Affect follows slowly through small changes and fast through big ones
    // (a bump shows within ~0.2 s, and the face does not twitch); the body
    // follows its samples at once.
    const kj = 1 - Math.exp(-dt / 0.05);
    for (const k in target) {
      if (!(k in mid)) mid[k] = target[k];
      if (BODY.includes(k)) { mid[k] = lerp(mid[k], target[k], kj); continue; }
      const m0 = (springs['_' + k] ??= { x: target[k] });
      m0.x = lerp(m0.x, target[k], kj);
      const gap = Math.abs(m0.x - mid[k]) * (k === 'arousal' ? 2 : 1);
      // Phasic signals attack at once; pain lingers ~1 s after; dominance is
      // posture, slower than expression (~2 s).
      const tau = k === 'td_valence' ? 0.08 : k === 'pain' ? (m0.x > mid[k] ? 0.06 : 0.8)
        : k === 'dominance' ? 2.0 : lerp(TAU, 0.05, clamp((gap - 0.06) / 0.14, 0, 1));
      mid[k] = lerp(mid[k], m0.x, 1 - Math.exp(-dt / tau));
    }
    if (W === 0) layoutFace();
    drawFace(dt, ms);
    // sound: a chirp when valence turns or pain starts, now and then when aroused
    if (Math.abs(mid.valence - lastChirpV) > 0.25 || Math.random() < dt * mid.arousal ** 2 * 0.5) {
      chirp(mid.valence, mid.arousal, mid.pain); lastChirpV = mid.valence;
    }
    histT += dt;
    if (histT >= 1 / HZ) {
      histT = 0; hist.push({ ...mid });
      if (hist.length > SPAN * HZ) hist.shift();
    }
    instT += dt;
    if (!app.classList.contains('face-only') && instT >= 1 / 15) {   // instruments at 15 fps
      instT = 0; drawMap(); drawGauges(); drawBody(); drawStrip();
      const [w, x] = words(), s = w + '|' + x;
      if (s !== lastWords) { lastWords = s; reading.innerHTML = w + (x ? `<small>· ${x}</small>` : ''); }
      if (performance.now() - lastMsg > 3000 && src.className === 'on' && !q.get('trace') && !window.FACE_TRACE)
        src.textContent = '● live, no emotion yet';
    }
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => { W = 0; }).observe(document.getElementById('stage'));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
